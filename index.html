<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pawslyy</title>

<style>
body {
  margin: 0;
  font-family: "Comic Sans MS", "Segoe UI", sans-serif;
  background: #fff6fb;
  color: #d88fb3;
  text-align: center;
  overflow-x: hidden;
}

/* bow borders */
.border-top, .border-bottom {
  background: repeating-linear-gradient(
    90deg,
    #ffd6ec,
    #ffd6ec 40px,
    #ffeaf5 40px,
    #ffeaf5 80px
  );
  padding: 12px;
  font-size: 18px;
}

header {
  font-size: 24px;
  padding: 10px;
}

/* main card */
.card {
  background: #ffffffcc;
  margin: 30px auto;
  padding: 25px;
  border-radius: 25px;
  width: 90%;
  max-width: 500px;
  box-shadow: 0 6px 16px rgba(255,182,214,0.4);
}

/* links */
.social-links a {
  display: inline-block;
  background: #ffd6ec;
  margin: 6px;
  padding: 10px 14px;
  border-radius: 14px;
  text-decoration: none;
  color: #c96f9c;
  font-weight: bold;
}

/* cursor hearts */
.heart {
  position: fixed;
  pointer-events: none;
  font-size: 14px;
  animation: floatUp 1s linear forwards;
}

@keyframes floatUp {
  to {
    transform: translateY(-20px);
    opacity: 0;
  }
}

/* falling stars */
.fall {
  position: fixed;
  top: -10px;
  animation: fall linear forwards;
}

@keyframes fall {
  to { transform: translateY(100vh); }
}
</style>
</head>

<body>

<div class="border-top">🎀 🎀 🎀 🎀 🎀 🎀 🎀 🎀</div>

<header>Pawslyy</header>

<div class="card">
<h2>૮₍ ˶ᵔ ᵕ ᵔ˶ ₎ა</h2>
<p>my cute pastel internet space</p>

<div class="social-links">
<a href="https://tiktok.com/@stupidbunie" target="_blank">TikTok</a>
<a href="https://twitter.com/pawslyy" target="_blank">Twitter</a>
<a href="https://t.me/pawslyy" target="_blank">Telegram</a>
<a href="https://www.roblox.com/users/profile?username=inwjecting" target="_blank">Roblox</a>
</div>
</div>

<div class="border-bottom">🎀 🎀 🎀 🎀 🎀 🎀 🎀 🎀</div>

<audio id="bgMusic" autoplay loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<script>
window.addEventListener("click", () => {
  document.getElementById("bgMusic").play();
}, { once: true });

/* cursor hearts */
document.addEventListener("mousemove", function(e) {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "💗";
  heart.style.left = e.clientX + "px";
  heart.style.top = e.clientY + "px";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 900);
});

/* falling stars */
setInterval(() => {
  const fall = document.createElement("div");
  fall.className = "fall";
  fall.innerHTML = "⭐";
  fall.style.left = Math.random() * 100 + "vw";
  fall.style.animationDuration = (3 + Math.random() * 3) + "s";
  document.body.appendChild(fall);
  setTimeout(() => fall.remove(), 6000);
}, 500);
</script>

</body>
</html>
