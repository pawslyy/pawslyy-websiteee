<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>pawslyy</title>

<style>
body{
  margin:0;
  background:#000;
  color:white;
  font-family:Arial;
  overflow:hidden;
  cursor:none;
}

/* LOADING SCREEN */
#loader{
  position:fixed;
  inset:0;
  background:black;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:999;
  font-size:22px;
  animation:fadeOut 2s forwards;
  animation-delay:2s;
}

@keyframes fadeOut{
  to{opacity:0;visibility:hidden;}
}

/* MAIN CARD */
.card{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#111;
  padding:40px;
  border-radius:18px;
  text-align:center;
  opacity:0;
  animation:fadeIn 2s forwards;
  animation-delay:2s;
}

@keyframes fadeIn{
  to{opacity:1;}
}

/* ICONS */
.icons a{
  margin:10px;
  color:white;
  text-decoration:none;
  transition:.2s;
}
.icons a:hover{
  transform:scale(1.2);
}

/* MUSIC PLAYER */
.player{
  position:absolute;
  bottom:40px;
  left:50%;
  transform:translateX(-50%);
  background:#111;
  padding:20px;
  border-radius:14px;
}

/* HEARTBEAT */
.player.beat{
  animation:heartBeat .6s;
}
@keyframes heartBeat{
  0%{transform:translateX(-50%) scale(1);}
  50%{transform:translateX(-50%) scale(1.05);}
  100%{transform:translateX(-50%) scale(1);}
}

/* FALLING HEARTS */
.heart{
  position:absolute;
  color:pink;
  animation:fall linear infinite;
}
@keyframes fall{
  to{transform:translateY(100vh);}
}

/* STARS */
.star{
  position:absolute;
  width:2px;
  height:2px;
  background:white;
}

/* BUNNY FOLLOWER */
#bunny{
  position:absolute;
  font-size:32px;
  pointer-events:none;
  transition:.1s;
}

/* PLUSHIES */
.plush{
  position:absolute;
  cursor:pointer;
  animation:float 5s infinite ease-in-out;
}
@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-15px);}
}
</style>
</head>

<body>

<div id="loader">loading...</div>

<div class="card">
<h1 id="typing"></h1>

<div class="icons">
<a href="https://tiktok.com/@stupidbunie">TikTok</a>
<a href="https://x.com/pawslyy">Twitter</a>
<a href="https://t.me/pawslyy">Telegram</a>
<a href="https://www.roblox.com/users/2634203674/profile">Roblox</a>
</div>
</div>

<div class="player" id="player">
<audio id="audio" src="music.mp3" autoplay loop></audio>
u seemed so perfect
</div>

<div id="bunny">🐰</div>

<div class="plush" style="left:20%;top:20%;">🧸</div>
<div class="plush" style="left:70%;top:30%;">🧸</div>

<script>
/* typing */
let t="pawslyy";
let i=0;
function type(){
 if(i<t.length){
  document.getElementById("typing").innerHTML+=t.charAt(i);
  i++;
  setTimeout(type,120);
 }
}
type();

/* stars */
for(let i=0;i<100;i++){
 let s=document.createElement("div");
 s.className="star";
 s.style.left=Math.random()*100+"vw";
 s.style.top=Math.random()*100+"vh";
 document.body.appendChild(s);
}

/* hearts */
setInterval(()=>{
 let h=document.createElement("div");
 h.className="heart";
 h.innerHTML="❤";
 h.style.left=Math.random()*100+"vw";
 h.style.animationDuration=(3+Math.random()*5)+"s";
 document.body.appendChild(h);
 setTimeout(()=>h.remove(),8000);
},400);

/* bunny follow */
document.addEventListener("mousemove",e=>{
 let b=document.getElementById("bunny");
 b.style.left=e.pageX+10+"px";
 b.style.top=e.pageY+10+"px";
});

/* heartbeat on music */
let audio=document.getElementById("audio");
let player=document.getElementById("player");
setInterval(()=>{
 if(!audio.paused){
  player.classList.add("beat");
  setTimeout(()=>player.classList.remove("beat"),200);
 }
},700);

/* plush click */
document.querySelectorAll(".plush").forEach(p=>{
 p.addEventListener("click",()=>{
  p.innerHTML="💗";
 });
});

/* autoplay fix */
document.body.addEventListener("click",()=>{
 audio.play();
},{once:true});
</script>

</body>
</html>
