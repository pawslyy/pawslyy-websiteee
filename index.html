<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>pawslyy</title>

<style>
body{
margin:0;
background:#ffeef5;
font-family:Arial;
color:#444;
overflow:hidden;
}

/* STARS */
.star{
position:absolute;
width:2px;
height:2px;
background:white;
opacity:.8;
}

/* FALLING HEARTS */
.heart{
position:absolute;
color:#ff9ecb;
animation:fall 6s linear infinite;
}
@keyframes fall{
to{transform:translateY(100vh);opacity:0;}
}

/* CARD */
.card{
position:absolute;
top:40%;
left:50%;
transform:translate(-50%,-50%);
background:#fff0f7;
padding:50px;
border-radius:24px;
text-align:center;
width:420px;
box-shadow:0 0 25px rgba(255,182,193,.3);
border:2px solid #ffd1dc;
}

.links a{
margin:10px;
color:#ff7fb0;
text-decoration:none;
}
.links a:visited{color:#ff7fb0;}
.links a:hover{opacity:.6}

/* MUSIC CONTROLS */
.musicbox{
position:absolute;
bottom:160px;
left:50%;
transform:translateX(-50%);
background:#fff0f7;
padding:10px;
border-radius:14px;
width:260px;
text-align:center;
border:2px solid #ffd1dc;
}

input[type=range]{
width:100%;
}

/* GAME */
#game{
position:absolute;
bottom:0;
width:100%;
height:140px;
background:#ffd1dc;
overflow:hidden;
border-top:3px solid #fff;
}

.cloud{
position:absolute;
font-size:28px;
opacity:.6;
}

#runner{
position:absolute;
bottom:10px;
left:40px;
font-size:34px;
}

.obstacle{
position:absolute;
bottom:10px;
right:-20px;
font-size:24px;
}

#score{
position:absolute;
right:20px;
top:10px;
font-size:14px;
opacity:.7;
}
</style>
</head>
<body>

<audio id="music" src="music.mp3" loop></audio>
<audio id="jumpSfx" src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"></audio>
<audio id="hitSfx" src="https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg"></audio>

<div class="card">
<h1>pawslyy</h1>
<div>hi i love u ♡</div>

<div class="links">
<a href="https://tiktok.com/@stupidbunie">TikTok</a>
<a href="https://x.com/pawslyy">Twitter</a>
<a href="https://t.me/pawslyy">Telegram</a>
<a href="https://www.roblox.com/users/2634203674/profile">Roblox</a>
</div>
</div>

<div class="musicbox">
<div>u seemed so perfect</div>
<input type="range" id="volume" min="0" max="1" step="0.01" value="0.6">
</div>

<div id="game">
<div id="runner">🐰</div>
<div id="score">0</div>
</div>

<script>

/* AUTOPLAY + VOLUME */
let music=document.getElementById("music");
music.volume=0.6;

function startMusic(){
music.play().catch(()=>{});
}
startMusic();
document.addEventListener("click",startMusic,{once:true});
document.addEventListener("touchstart",startMusic,{once:true});

volume.oninput=e=>music.volume=e.target.value;

/* STAR BACKGROUND */
for(let i=0;i<120;i++){
let s=document.createElement("div");
s.className="star";
s.style.top=Math.random()*100+"vh";
s.style.left=Math.random()*100+"vw";
document.body.appendChild(s);
}

/* FALLING HEARTS */
setInterval(()=>{
let h=document.createElement("div");
h.className="heart";
h.innerHTML="♡";
h.style.left=Math.random()*100+"vw";
document.body.appendChild(h);
setTimeout(()=>h.remove(),6000);
},500);

/* CLOUD BACKGROUND */
setInterval(()=>{
let cl=document.createElement("div");
cl.className="cloud";
cl.innerHTML="☁";
cl.style.top=Math.random()*50+"px";
cl.style.left=window.innerWidth+"px";
game.appendChild(cl);

let x=window.innerWidth;
let move=setInterval(()=>{
x-=1;
cl.style.left=x+"px";
if(x<-40){clearInterval(move);cl.remove();}
},30);
},2000);

/* MINI GAME */
let runner=document.getElementById("runner");
let scoreEl=document.getElementById("score");
let jumping=false;
let score=0;
let alive=true;

function jump(){
if(!jumping){
jumpSfx.play();
jumping=true;
let pos=10;
let up=setInterval(()=>{
pos+=6;
runner.style.bottom=pos+"px";
if(pos>70) clearInterval(up);
},20);

setTimeout(()=>{
let down=setInterval(()=>{
pos-=6;
runner.style.bottom=pos+"px";
if(pos<=10){
clearInterval(down);
jumping=false;
}
},20);
},300);
}
}

document.addEventListener("keydown",e=>{
if(e.code==="Space") jump();
});
document.addEventListener("touchstart",jump);

let best=localStorage.getItem("bestScore")||0;

function spawn(){
if(!alive)return;

let o=document.createElement("div");
o.className="obstacle";
o.innerHTML="🌵";
game.appendChild(o);

let x=window.innerWidth;

let move=setInterval(()=>{
x-=6;
o.style.right=(window.innerWidth-x)+"px";

let r=parseInt(runner.style.bottom||10);
if(x<90 && x>40 && r<25){
hitSfx.play();
alive=false;
best=Math.max(best,score);
localStorage.setItem("bestScore",best);
alert("pawslyy 1 — you 0 | best "+best);
location.reload();
}

if(x<0){
clearInterval(move);
o.remove();
score++;
scoreEl.innerHTML=score+" | best "+best;
}
},30);

setTimeout(spawn,1700);
}
spawn();

</script>
</body>
</html>
