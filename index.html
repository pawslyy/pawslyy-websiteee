<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pawslyy</title>

<style>
body{
  margin:0;
  background:#000;
  font-family:Arial, Helvetica, sans-serif;
  color:white;
  overflow:hidden;
}

/* floating stars */
.star{
  position:absolute;
  width:2px;
  height:2px;
  background:white;
  opacity:.8;
  animation:twinkle 3s infinite alternate;
}
@keyframes twinkle{
  from{opacity:.2}
  to{opacity:1}
}

/* card */
.card{
  position:absolute;
  top:45%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#111;
  padding:40px;
  border-radius:18px;
  text-align:center;
  animation:breath 4s ease-in-out infinite;
}
@keyframes breath{
  0%,100%{transform:translate(-50%,-50%) scale(1)}
  50%{transform:translate(-50%,-50%) scale(1.02)}
}

h1{margin:0;font-weight:600}

/* links */
.links a{
  color:white;
  margin:0 12px;
  text-decoration:none;
  position:relative;
}
.links a:hover::after{
  content:"♡";
  position:absolute;
  top:-10px;
  left:50%;
  transform:translateX(-50%);
  font-size:12px;
}

/* typing dots */
.typing::after{
  content:"...";
  animation:dots 1.5s infinite;
}
@keyframes dots{
  0%{content:"."}
  33%{content:".."}
  66%{content:"..."}
}

/* music player */
.player{
  position:absolute;
  bottom:80px;
  left:50%;
  transform:translateX(-50%);
  background:#111;
  padding:20px;
  border-radius:12px;
}

/* hearts burst */
.heart{
  position:absolute;
  color:pink;
  animation:pop 1s forwards;
}
@keyframes pop{
  to{transform:translateY(-60px);opacity:0}
}

/* plushie */
.plush{
  position:absolute;
  cursor:grab;
  font-size:22px;
}

/* bunny */
#bunny{
  position:absolute;
  bottom:10px;
  right:10px;
  cursor:pointer;
}

/* sticker */
.sticker{
  position:absolute;
  font-size:18px;
}
</style>
</head>

<body>

<audio id="music" autoplay loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<div class="card" id="card">
<h1>pawslyy</h1>
<div class="typing">hi i love u ♡</div>

<div class="links">
<a href="https://tiktok.com/@stupidbunie" target="_blank">TikTok</a>
<a href="https://x.com/pawslyy" target="_blank">Twitter</a>
<a href="https://t.me/pawslyy" target="_blank">Telegram</a>
<a href="https://www.roblox.com/users/2634203674/profile" target="_blank">Roblox</a>
</div>

<div id="pet">🐰</div>
</div>

<div class="player">u seemed so perfect</div>

<div id="bunny">🐰</div>

<script>
/* stars */
for(let i=0;i<120;i++){
 let s=document.createElement("div");
 s.className="star";
 s.style.left=Math.random()*window.innerWidth+"px";
 s.style.top=Math.random()*window.innerHeight+"px";
 document.body.appendChild(s);
}

/* click hearts burst */
document.addEventListener("click",e=>{
 for(let i=0;i<6;i++){
  let h=document.createElement("div");
  h.className="heart";
  h.innerHTML="♡";
  h.style.left=e.clientX+"px";
  h.style.top=e.clientY+"px";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),1000);
 }
});

/* double click plushie spawn */
document.addEventListener("dblclick",e=>{
 let p=document.createElement("div");
 p.className="plush";
 p.innerHTML="🧸";
 p.style.left=e.clientX+"px";
 p.style.top=e.clientY+"px";
 document.body.appendChild(p);
 drag(p);
});

/* draggable plushies */
function drag(el){
 el.onmousedown=function(e){
  document.onmousemove=function(ev){
   el.style.left=ev.clientX+"px";
   el.style.top=ev.clientY+"px";
  }
  document.onmouseup=function(){
   document.onmousemove=null;
  }
 }
}

/* floating stars pop */
document.querySelectorAll(".star").forEach(st=>{
 st.onclick=()=>st.remove();
});

/* bunny expression */
let bunny=document.getElementById("bunny");
let mood=false;
bunny.onclick=()=>{
 mood=!mood;
 bunny.innerHTML=mood?"(•ᴗ•)":"🐰";
}

/* sticker system (shift click) */
document.addEventListener("click",e=>{
 if(e.shiftKey){
  let s=document.createElement("div");
  s.className="sticker";
  s.innerHTML="⭐";
  s.style.left=e.clientX+"px";
  s.style.top=e.clientY+"px";
  document.body.appendChild(s);
 }
});

/* autoplay fix */
window.addEventListener("click",()=>{
 document.getElementById("music").play();
},{once:true});
</script>

</body>
</html>
