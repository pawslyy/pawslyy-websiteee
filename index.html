<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pawslyy</title>

<style>
:root{
--bg:#f6e7ea;
--glass:rgba(255,255,255,.45);
--pink1:#eec7cf;
--pink2:#f3d5da;
--text:#b98f86;
--radius:20px;
--shadow:0 10px 30px rgba(160,120,110,.2);
}

*{box-sizing:border-box;margin:0;padding:0}

body{
background:url("bg.jpg") center/cover fixed;
font-family:'Segoe UI',sans-serif;
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
inset:0;
background:rgba(255,255,255,.35);
backdrop-filter:blur(2px);
z-index:-1;
}

/* HEADER */
.header{
text-align:center;
padding:14px;
font-size:28px;
color:var(--text);
animation:float 4s ease-in-out infinite;
}

@keyframes float{
0%,100%{transform:translateY(0)}
50%{transform:translateY(6px)}
}

/* CARDS */
.card{
background:var(--glass);
backdrop-filter:blur(10px);
padding:20px;
margin:20px auto;
width:min(700px,90vw);
border-radius:var(--radius);
box-shadow:var(--shadow);
transition:.2s;
}

.card:hover{
transform:translateY(-4px);
}

/* SOCIALS */
.socials{
display:flex;
flex-wrap:wrap;
gap:10px;
justify-content:center;
}

.socials a{
background:var(--pink2);
padding:10px 16px;
border-radius:12px;
text-decoration:none;
color:var(--text);
font-weight:bold;
}

/* GAME */
#game{
height:200px;
background:var(--pink1);
border-radius:16px;
position:relative;
overflow:hidden;
}

#player{
position:absolute;
bottom:22px;
left:40px;
font-size:28px;
}

.jump{
animation:jump .45s ease;
}

@keyframes jump{
0%{transform:translateY(0)}
50%{transform:translateY(-80px)}
100%{transform:translateY(0)}
}

.ground{
position:absolute;
bottom:0;
height:20px;
width:200%;
background:var(--pink2);
animation:move 1s linear infinite;
}

@keyframes move{
from{transform:translateX(0)}
to{transform:translateX(-50%)}
}

.obstacle{
position:absolute;
bottom:22px;
font-size:28px;
right:-40px;
}

/* OVERLAY */
.overlay{
position:absolute;
inset:0;
background:rgba(255,255,255,.6);
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
}

/* HUD */
.hud{
display:flex;
justify-content:space-between;
margin-top:8px;
color:var(--text);
}

.pop{
animation:pop .2s;
}

@keyframes pop{
50%{transform:scale(1.2)}
}

/* CURSOR */
.dot{
position:fixed;
width:8px;
height:8px;
background:var(--pink1);
border-radius:50%;
pointer-events:none;
z-index:999;
}

.ring{
position:fixed;
width:20px;
height:20px;
border:2px solid var(--pink1);
border-radius:50%;
pointer-events:none;
z-index:998;
}

/* MUSIC BUTTON */
.music{
position:fixed;
bottom:15px;
right:15px;
background:var(--glass);
padding:10px;
border-radius:14px;
box-shadow:var(--shadow);
cursor:pointer;
}
</style>
</head>

<body>

<div class="header">⊹₊˚‧︵‿₊୨ᰔ୧₊‿︵‧˚₊⊹</div>

<div class="card">
<div class="socials">
<a href="https://tiktok.com/@stupidbunie" target="_blank">TikTok</a>
<a href="https://twitter.com/pawslyy" target="_blank">Twitter</a>
<a href="https://t.me/pawslyy" target="_blank">Telegram</a>
<a href="https://roblox.com/users/profile?username=inwjecting" target="_blank">Roblox</a>
</div>
</div>

<div class="card">
<div id="game">
<div id="player">୨୧</div>
<div class="ground"></div>
<div class="overlay" id="overlay">
<button onclick="start()">start</button>
</div>
</div>
<div class="hud">
score:<span id="score">0</span>
best:<span id="best">0</span>
</div>
</div>

<div class="dot" id="dot"></div>
<div class="ring" id="ring"></div>

<div class="music" onclick="toggle()">♫</div>

<audio id="music" autoplay loop>
<source src="music.mp3">
</audio>

<script>
music.play().catch(()=>{});
document.addEventListener("click",()=>music.play(),{once:true});

function toggle(){
music.paused?music.play():music.pause();
}

/* CURSOR */
document.addEventListener("mousemove",e=>{
dot.style.left=e.clientX+"px";
dot.style.top=e.clientY+"px";
ring.style.left=e.clientX-6+"px";
ring.style.top=e.clientY-6+"px";
});

/* GAME */
let score=0;
let best=localStorage.getItem("best")||0;
bestEl=document.getElementById("best");
bestEl.textContent=best;
let running=false;
let speed=4;

function jump(){
if(!running)return;
player.classList.add("jump");
setTimeout(()=>player.classList.remove("jump"),450);
}

document.addEventListener("keydown",jump);
document.addEventListener("click",jump);

function start(){
overlay.style.display="none";
running=true;
spawn();
}

function spawn(){
if(!running)return;

const obs=document.createElement("div");
obs.className="obstacle";
obs.innerHTML="✿";
game.appendChild(obs);

let passed=false;
let x=-40;

const move=setInterval(()=>{
x+=speed;
obs.style.right=x+"px";

const p=player.getBoundingClientRect();
const o=obs.getBoundingClientRect();

if(p.right-10>o.left&&p.bottom-10>o.top&&p.left+10<o.right){
running=false;
overlay.style.display="flex";
score=0;
scoreEl.textContent=score;
obs.remove();
clearInterval(move);
return;
}

if(!passed&&o.right<p.left){
passed=true;
score++;
scoreEl.textContent=score;
scoreEl.classList.add("pop");
setTimeout(()=>scoreEl.classList.remove("pop"),200);
if(score>best){
best=score;
localStorage.setItem("best",best);
bestEl.textContent=best;
}
}

if(o.right<0){
obs.remove();
clearInterval(move);
}

},16);

setTimeout(spawn,2000-Math.random()*500);
}
</script>
</body>
</html>
