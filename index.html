<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>pawslyy</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
body{
margin:0;
background:black;
font-family:'Press Start 2P', monospace;
color:white;
overflow:hidden;
}

/* CARD */
.card{
position:absolute;
top:40%;
left:50%;
transform:translate(-50%,-50%);
background:#111;
padding:40px;
border-radius:18px;
text-align:center;
width:420px;
border:1px solid #333;
}

.links a{
margin:10px;
color:white;
text-decoration:none;
}

/* STARS */
.star{
position:absolute;
font-size:10px;
cursor:pointer;
}

/* SPARKLES */
.spark{
position:absolute;
color:pink;
animation:pop .6s forwards;
}
@keyframes pop{to{opacity:0;transform:translateY(-20px);}}

/* ACHIEVEMENT */
.toast{
position:absolute;
bottom:200px;
left:50%;
transform:translateX(-50%);
background:#111;
padding:8px 14px;
border-radius:10px;
font-size:10px;
}

/* GAME */
#game{
position:absolute;
bottom:0;
width:100%;
height:140px;
background:#111;
border-top:1px solid #333;
}

#runner{
position:absolute;
bottom:10px;
left:40px;
font-size:26px;
}

.coin{
position:absolute;
bottom:50px;
font-size:18px;
}

.obstacle{
position:absolute;
bottom:10px;
}

#counter{
position:absolute;
top:10px;
left:10px;
font-size:10px;
}
</style>
</head>
<body>

<audio id="music" src="music.mp3" loop></audio>

<div class="card">
<h1>pawslyy</h1>
<div>hi i love u ♡</div>

<div class="links">
<a href="https://tiktok.com/@stupidbunie">TikTok</a>
<a href="https://x.com/pawslyy">Twitter</a>
<a href="https://t.me/pawslyy">Telegram</a>
<a href="https://www.roblox.com/users/2634203674/profile">Roblox</a>
</div>

<div id="counter">stars: 0</div>
<button id="decorate">decorate</button>
</div>

<div id="game">
<div id="runner">🐰</div>
</div>

<script>

/* AUTOPLAY */
music.play().catch(()=>{});
document.addEventListener("click",()=>music.play(),{once:true});

/* COLLECTIBLE STARS */
let starCount=0;
for(let i=0;i<40;i++){
let s=document.createElement("div");
s.className="star";
s.innerHTML="✦";
s.style.left=Math.random()*100+"vw";
s.style.top=Math.random()*100+"vh";
document.body.appendChild(s);

s.onclick=()=>{
starCount++;
counter.innerHTML="stars: "+starCount;
spark(s.offsetLeft,s.offsetTop);
s.remove();
};
}

/* SPARKLE EFFECT */
function spark(x,y){
for(let i=0;i<4;i++){
let sp=document.createElement("div");
sp.className="spark";
sp.innerHTML="✦";
sp.style.left=x+"px";
sp.style.top=y+"px";
document.body.appendChild(sp);
setTimeout(()=>sp.remove(),600);
}
}

/* CLICK SPARKLES */
document.addEventListener("click",e=>{
spark(e.clientX,e.clientY);
});

/* STICKER MODE */
let decorating=false;
decorate.onclick=()=>decorating=!decorating;

document.addEventListener("click",e=>{
if(decorating){
let st=document.createElement("div");
st.innerHTML="⭐";
st.style.position="absolute";
st.style.left=e.clientX+"px";
st.style.top=e.clientY+"px";
document.body.appendChild(st);
}
});

/* BUNNY COSTUMES */
let runner=document.getElementById("runner");
let skins=["🐰","🐱","🐶","🦊"];
let skin=0;
runner.onclick=()=>{
skin++; if(skin>=skins.length)skin=0;
runner.innerHTML=skins[skin];
achievement("bunny clicked");
};

/* PET MOOD */
setInterval(()=>{
runner.innerHTML="😴";
},15000);

music.onplay=()=>{
runner.innerHTML="🐰";
};

/* MINI GAME */
let jumping=false;
let score=0;

function jump(){
if(!jumping){
jumping=true;
achievement("first jump");
let pos=10;
let up=setInterval(()=>{
pos+=6;
runner.style.bottom=pos+"px";
if(pos>70)clearInterval(up);
},20);

setTimeout(()=>{
let down=setInterval(()=>{
pos-=6;
runner.style.bottom=pos+"px";
if(pos<=10){
clearInterval(down);
jumping=false;
}
},20);
},300);
}
}

document.addEventListener("keydown",e=>{
if(e.code==="Space")jump();
});
document.addEventListener("touchstart",jump);

/* COINS */
function coin(){
let c=document.createElement("div");
c.className="coin";
c.innerHTML="💗";
game.appendChild(c);

let x=window.innerWidth;
let move=setInterval(()=>{
x-=5;
c.style.left=x+"px";

if(x<60 && x>30){
score++;
achievement("coin!");
c.remove();
clearInterval(move);
}

if(x<0){
c.remove();
clearInterval(move);
}
},30);

setTimeout(coin,3000);
}
coin();

/* ACHIEVEMENTS */
function achievement(text){
let t=document.createElement("div");
t.className="toast";
t.innerHTML=text;
document.body.appendChild(t);
setTimeout(()=>t.remove(),2000);
}
</script>
</body>
</html>
