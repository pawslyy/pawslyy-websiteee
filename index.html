<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pawslyy</title>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: linear-gradient(#fff0f7, #ffe6f3);
  text-align: center;
  overflow-x: hidden;
  color: #555;
}

header {
  background: #ffcce6;
  padding: 18px;
  font-size: 22px;
  font-weight: bold;
  position: sticky;
  top: 0;
  z-index: 10;
}

/* Hero */
.hero {
  padding: 40px 20px;
  animation: fadeIn 1s ease-in;
}

.hero h1 {
  font-size: 34px;
}

.hero p {
  font-size: 18px;
}

/* Game box */
.game-box {
  background: white;
  margin: 20px;
  padding: 20px;
  border-radius: 20px;
  box-shadow: 0 6px 14px rgba(0,0,0,0.08);
}

#gameArea {
  height: 180px;
  background: #fff7fb;
  border-radius: 16px;
  position: relative;
  overflow: hidden;
  margin-top: 10px;
}

.star {
  position: absolute;
  font-size: 22px;
  cursor: pointer;
}

/* Social links */
.socials {
  padding: 30px;
}

.social-links {
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
}

.social-links a {
  background: #ffd6ec;
  padding: 10px 16px;
  border-radius: 12px;
  text-decoration: none;
  color: #444;
  font-weight: 600;
}

/* Cursor hearts */
.heart {
  position: fixed;
  pointer-events: none;
  font-size: 14px;
  animation: floatUp 1s linear forwards;
}

/* Falling hearts */
.fall {
  position: fixed;
  top: -20px;
  animation: fall linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(100vh);
  }
}

@keyframes floatUp {
  to {
    transform: translateY(-25px);
    opacity: 0;
  }
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
</style>
</head>

<body>

<header>Pawslyy</header>

<section class="hero">
<h1>૮₍ ˶ᵔ ᵕ ᵔ˶ ₎ა</h1>
<p>Welcome to my cute internet corner ✿</p>
</section>

<section class="game-box">
<h2>Catch the Star Game ⭐</h2>
<p>Tap the stars!</p>
<div id="gameArea"></div>
<p>Score: <span id="score">0</span></p>
</section>

<section class="socials">
<h2>Find Me Online</h2>
<div class="social-links">
<a href="https://tiktok.com/@stupidbunie" target="_blank">TikTok</a>
<a href="https://twitter.com/pawslyy" target="_blank">Twitter</a>
<a href="https://t.me/pawslyy" target="_blank">Telegram</a>
<a href="https://www.roblox.com/users/profile?username=inwjecting" target="_blank">Roblox</a>
</div>
</section>

<audio id="bgMusic" autoplay loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<script>
/* music autoplay backup */
window.addEventListener("click", () => {
  document.getElementById("bgMusic").play();
}, { once: true });

/* cursor hearts */
document.addEventListener("mousemove", function(e) {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "💗";
  heart.style.left = e.clientX + "px";
  heart.style.top = e.clientY + "px";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 900);
});

/* falling hearts background */
setInterval(() => {
  const fall = document.createElement("div");
  fall.className = "fall";
  fall.innerHTML = "💖";
  fall.style.left = Math.random() * 100 + "vw";
  fall.style.animationDuration = (3 + Math.random() * 4) + "s";
  document.body.appendChild(fall);
  setTimeout(() => fall.remove(), 7000);
}, 400);

/* mini kawaii game */
let score = 0;
const gameArea = document.getElementById("gameArea");

function spawnStar() {
  const star = document.createElement("div");
  star.className = "star";
  star.innerHTML = "⭐";

  star.style.left = Math.random() * 90 + "%";
  star.style.top = Math.random() * 70 + "%";

  star.onclick = () => {
    score++;
    document.getElementById("score").innerText = score;
    star.remove();
  };

  gameArea.appendChild(star);
  setTimeout(() => star.remove(), 2000);
}

setInterval(spawnStar, 800);
</script>

</body>
</html>
