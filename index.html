<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pawslyy</title>

<style>
body {
  margin:0;
  background:#000;
  color:white;
  font-family:Arial, Helvetica, sans-serif;
  overflow:hidden;
  cursor:none;
}

/* CENTER CARD */
.card{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#111;
  padding:40px;
  border-radius:18px;
  text-align:center;
}

/* ICONS */
.icons a{
  margin:10px;
  display:inline-block;
  transition:0.2s;
  color:white;
  text-decoration:none;
}
.icons a:hover{
  transform:translateY(-5px) scale(1.1);
}

/* MUSIC PLAYER */
.player{
  position:absolute;
  bottom:40px;
  left:50%;
  transform:translateX(-50%);
  background:#111;
  padding:20px;
  border-radius:14px;
  width:300px;
}

.eq{
  display:flex;
  justify-content:center;
  gap:3px;
  margin-bottom:10px;
}

.bar{
  width:4px;
  height:10px;
  background:white;
  animation:beat 0.5s infinite alternate;
}

@keyframes beat{
  from{height:5px}
  to{height:25px}
}

/* HEART FALL */
.heart{
  position:absolute;
  color:pink;
  animation:fall linear infinite;
}
@keyframes fall{
  to{ transform:translateY(100vh); }
}

/* PIXEL STARS */
.star{
  position:absolute;
  width:2px;
  height:2px;
  background:white;
}

/* BUNNY */
.bunny{
  position:absolute;
  bottom:20px;
  right:20px;
  font-size:40px;
}

/* FLOATING PLUSH */
.plush{
  position:absolute;
  animation:float 6s infinite ease-in-out;
}
@keyframes float{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-15px)}
}

/* CURSOR */
.cursor{
  position:absolute;
  pointer-events:none;
  font-size:18px;
}
</style>
</head>

<body>

<div class="card">
  <h1 id="typing"></h1>

  <div class="icons">
    <a href="https://tiktok.com/@stupidbunie" target="_blank">TikTok</a>
    <a href="https://x.com/pawslyy" target="_blank">Twitter</a>
    <a href="https://t.me/pawslyy" target="_blank">Telegram</a>
    <a href="https://www.roblox.com/users/2634203674/profile" target="_blank">Roblox</a>
  </div>
</div>

<div class="player">
  <div class="eq">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
  </div>
  <audio id="audio" src="music.mp3" autoplay loop></audio>
</div>

<div class="bunny">🐰</div>
<div class="plush" style="left:10%;top:20%;">🧸</div>
<div class="plush" style="left:80%;top:30%;">🧸</div>

<script>
/* typing animation */
let text="pawslyy";
let i=0;
function type(){
 if(i<text.length){
   document.getElementById("typing").innerHTML+=text.charAt(i);
   i++;
   setTimeout(type,120);
 }
}
type();

/* falling hearts */
setInterval(()=>{
 let h=document.createElement("div");
 h.className="heart";
 h.innerHTML="❤";
 h.style.left=Math.random()*100+"vw";
 h.style.animationDuration=(3+Math.random()*5)+"s";
 document.body.appendChild(h);
 setTimeout(()=>h.remove(),8000);
},400);

/* stars */
for(let i=0;i<100;i++){
 let s=document.createElement("div");
 s.className="star";
 s.style.left=Math.random()*100+"vw";
 s.style.top=Math.random()*100+"vh";
 document.body.appendChild(s);
}

/* cursor hearts */
document.addEventListener("mousemove",e=>{
 let c=document.createElement("div");
 c.className="cursor";
 c.innerHTML="❤";
 c.style.left=e.pageX+"px";
 c.style.top=e.pageY+"px";
 document.body.appendChild(c);
 setTimeout(()=>c.remove(),500);
});

/* click sound */
document.addEventListener("click",()=>{
 let snd=new Audio("music.mp3");
 snd.volume=0.1;
 snd.play();
});
</script>

</body>
</html>
