<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pawslyy</title>

<style>
body{
  margin:0;
  background:black;
  font-family:Arial, Helvetica, sans-serif;
  overflow:hidden;
  color:white;
}

/* stars */
.star{
  position:fixed;
  width:2px;
  height:2px;
  background:white;
  opacity:.8;
}

/* falling hearts */
.heart{
  position:fixed;
  color:#ffd1dc;
  font-size:12px;
  animation:fall 8s linear infinite;
}

@keyframes fall{
  from{transform:translateY(-10px);}
  to{transform:translateY(110vh);}
}

/* center card */
.card{
  position:absolute;
  top:40%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#111;
  padding:40px 60px;
  border-radius:18px;
  text-align:center;
}

.links a{
  color:white;
  text-decoration:none;
  margin:0 10px;
}

/* music player */
#musicPlayer{
  position:fixed;
  bottom:140px;
  left:50%;
  transform:translateX(-50%);
  background:#111;
  padding:10px 20px;
  border-radius:14px;
}

/* GAME FIXED POSITION */
#gameContainer{
  position:fixed;
  bottom:40px;
  left:50%;
  transform:translateX(-50%);
  text-align:center;
}

#score{
  font-size:14px;
  margin-bottom:6px;
  opacity:.8;
}

canvas{
  background:#222;
  border-radius:8px;
}
</style>
</head>

<body>

<div class="card">
<h1>pawslyy</h1>
<p>hi i love u ♡</p>

<div class="links">
<a href="https://www.tiktok.com/@stupidbunie" target="_blank">TikTok</a>
<a href="https://x.com/pawslyy" target="_blank">Twitter</a>
<a href="https://t.me/pawslyy" target="_blank">Telegram</a>
<a href="https://www.roblox.com/users/2634203674/profile" target="_blank">Roblox</a>
</div>
</div>

<!-- music -->
<div id="musicPlayer">
u seemed so perfect
<input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
</div>

<audio id="music" src="music.mp3" autoplay loop></audio>

<!-- game -->
<div id="gameContainer">
<div id="score">score: 0</div>
<canvas id="gameCanvas" width="300" height="90"></canvas>
</div>

<script>
/* autoplay fix */
const music=document.getElementById("music");
document.body.addEventListener("click",()=>music.play(),{once:true});

document.getElementById("volume").oninput=e=>{
music.volume=e.target.value;
};

/* stars */
for(let i=0;i<80;i++){
let s=document.createElement("div");
s.className="star";
s.style.top=Math.random()*100+"vh";
s.style.left=Math.random()*100+"vw";
document.body.appendChild(s);
}

/* falling hearts */
setInterval(()=>{
let h=document.createElement("div");
h.className="heart";
h.innerHTML="♡";
h.style.left=Math.random()*100+"vw";
document.body.appendChild(h);
setTimeout(()=>h.remove(),8000);
},900);

/* mini game */
const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");

let bunnyY=60;
let velocity=0;
let gravity=.5;
let jumping=false;
let obstacles=[];
let score=0;

function jump(){
if(!jumping){
velocity=-8;
jumping=true;
}
}

document.addEventListener("keydown",e=>{
if(e.code==="Space") jump();
});

canvas.addEventListener("click",jump);

function spawnObstacle(){
obstacles.push({x:300});
}

setInterval(spawnObstacle,2000);

function gameLoop(){
ctx.clearRect(0,0,300,90);

velocity+=gravity;
bunnyY+=velocity;

if(bunnyY>60){
bunnyY=60;
velocity=0;
jumping=false;
}

/* bunny */
ctx.fillStyle="white";
ctx.fillRect(20,bunnyY,10,10);

/* obstacles */
ctx.fillStyle="white";
for(let o of obstacles){
o.x-=3;
ctx.fillRect(o.x,70,8,8);

if(o.x<30 && o.x>20 && bunnyY>55){
score=0;
obstacles=[];
}

if(o.x===20) score++;
}

document.getElementById("score").innerText="score: "+score;

requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
