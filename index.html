<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pawslyy</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root { --scale: 1.3; } /* 30% bigger */

* { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }

body{
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  background: url("./wp13418322-sweet-4k-wallpapers.png") no-repeat center/cover;
}

/* rain */
.rain{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:1;
}

.drop{
  position:absolute;
  top:-10vh;
  width: calc(6px * var(--scale));
  height: calc(12px * var(--scale));
  border-radius:999px;
  background: rgba(255,255,255,0.38);
  box-shadow: 0 0 10px rgba(255, 190, 215, 0.25);
  animation: fall linear infinite;
}

.drop::after{
  content:"";
  position:absolute;
  left: 1px;
  top: 2px;
  width: 2px;
  height: 4px;
  border-radius:999px;
  background: rgba(255,255,255,0.6);
}

@keyframes fall{
  to { transform: translateY(130vh); }
}

/* card */
.card{
  z-index:2;
  width: calc(520px * var(--scale));
  padding: calc(36px * var(--scale));
  border-radius: calc(22px * var(--scale));
  text-align:center;
  background: rgba(255, 220, 230, 0.6);
  backdrop-filter: blur(14px);
  box-shadow: 0 30px 60px rgba(0,0,0,0.2);
}

.name{
  font-size: calc(26px * var(--scale));
  color:#fff;
  font-weight:500;
  margin-bottom: 14px;
}

.spark{
  color:#fff;
  letter-spacing:8px;
  margin-bottom: 26px;
}

.icons{
  display:flex;
  justify-content:center;
  gap: calc(26px * var(--scale));
}

.icons a{
  width: calc(44px * var(--scale));
  height: calc(44px * var(--scale));
  display:grid;
  place-items:center;
  border-radius:999px;
  text-decoration:none;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.2);
  transition: 0.25s;
}

.icons a i{
  color:#fff;
  font-size: calc(20px * var(--scale));
}

.icons a:hover{
  transform: scale(1.15);
  background: rgba(255,255,255,0.25);
}

/* music overlay button (needed for autoplay blocks) */
.musicOverlay{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:3;
  background: rgba(0,0,0,0.15);
  backdrop-filter: blur(2px);
}

.musicOverlay button{
  border:none;
  border-radius:999px;
  padding: 14px 20px;
  background: rgba(255,220,230,0.85);
  color:#fff;
  font-size:16px;
  cursor:pointer;
  box-shadow: 0 20px 40px rgba(0,0,0,0.18);
}

.musicOverlay.hidden{ display:none; }
</style>
</head>

<body>

<div class="rain" id="rain"></div>

<div class="card">
  <div class="name">pawslyy</div>
  <div class="spark">✦ ✧ ✦</div>

  <div class="icons">
    <a href="https://www.tiktok.com/@emmaviea" target="_blank" rel="noopener noreferrer">
      <i class="fa-brands fa-tiktok"></i>
    </a>
    <a href="https://x.com/pawslyy" target="_blank" rel="noopener noreferrer">
      <i class="fa-brands fa-x-twitter"></i>
    </a>
    <a href="https://t.me/pawslyy" target="_blank" rel="noopener noreferrer">
      <i class="fa-brands fa-telegram"></i>
    </a>
  </div>
</div>

<!-- Music -->
<audio id="music" loop>
  <source src="./music.mp3" type="audio/mpeg">
</audio>

<!-- Click-to-start overlay (because browsers block autoplay) -->
<div class="musicOverlay" id="overlay">
  <button id="startBtn"><i class="fa-solid fa-play"></i> Play music</button>
</div>

<script>
/* Rain (instant + moving) */
const rain = document.getElementById("rain");
const drops = 120;

for (let i = 0; i < drops; i++){
  const d = document.createElement("div");
  d.className = "drop";
  d.style.left = Math.random() * 100 + "vw";
  d.style.opacity = 0.18 + Math.random() * 0.45;
  d.style.animationDuration = (1.8 + Math.random() * 2.8) + "s";
  d.style.animationDelay = (-Math.random() * 3) + "s"; // shows instantly
  rain.appendChild(d);
}

/* Music start */
const music = document.getElementById("music");
const overlay = document.getElementById("overlay");
document.getElementById("startBtn").addEventListener("click", async () => {
  try {
    await music.play();
    overlay.classList.add("hidden");
  } catch (e) {
    // if it still fails, the button stays
  }
});
</script>

</body>
</html>
