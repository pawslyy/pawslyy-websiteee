<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pawslyy</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: #fff6fb;
  color: #d88fb3;
  text-align: center;
  overflow-x: hidden;
  cursor: url("https://cur.cursors-4u.net/cursors/cur-9/cur817.cur"), auto;
}

/* page container */
.container {
  max-width: 720px;
  margin: auto;
  padding: 20px;
}

/* animated header */
.lace-header {
  font-size: clamp(20px, 4vw, 36px);
  padding: 16px;
  background: #ffeaf5;
  animation: floatGlow 3s ease-in-out infinite,
             pastelRainbow 6s linear infinite;
}

header {
  font-size: clamp(22px, 5vw, 34px);
  margin: 10px 0 20px 0;
}

@keyframes floatGlow {
  0% { transform: translateY(0px); }
  50% { transform: translateY(6px); }
  100% { transform: translateY(0px); }
}

@keyframes pastelRainbow {
  0% { color: #f4a6c0; }
  25% { color: #f7b6d2; }
  50% { color: #cdb4db; }
  75% { color: #bde0fe; }
  100% { color: #ffc8dd; }
}

/* cards */
.card {
  background: #ffffffcc;
  margin: 20px 0;
  padding: 24px;
  border-radius: 24px;
  box-shadow: 0 6px 18px rgba(255,182,214,0.3);
}

/* social buttons */
.social-links {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
}

.social-links a {
  background: #ffd6ec;
  padding: 12px 16px;
  border-radius: 14px;
  text-decoration: none;
  color: #c96f9c;
  font-weight: bold;
}

/* game */
#gameArea {
  height: 220px;
  background: #fff7fb;
  border-radius: 16px;
  position: relative;
  overflow: hidden;
  margin-top: 10px;
}

.item {
  position: absolute;
  font-size: 26px;
  cursor: pointer;
}

/* cursor trail */
.symbol {
  position: fixed;
  pointer-events: none;
  font-size: 18px;
  animation: floatUp 1s linear forwards;
}

@keyframes floatUp {
  to {
    transform: translateY(-25px);
    opacity: 0;
  }
}

/* falling symbols */
.fall {
  position: fixed;
  top: -20px;
  font-size: 22px;
  animation: fall linear forwards;
}

@keyframes fall {
  to { transform: translateY(100vh); }
}

/* bottom decoration */
.lace-bottom {
  font-size: clamp(18px, 3vw, 26px);
  padding: 14px;
  background: #ffeaf5;
  margin-top: 20px;
}
</style>
</head>

<body>

<div class="lace-header">
⊹₊˚‧︵‿₊୨ᰔ୧₊‿︵‧˚₊⊹
</div>

<div class="container">

<header>Pawslyy</header>

<div class="card">
<div class="social-links">
<a href="https://tiktok.com/@stupidbunie" target="_blank">TikTok</a>
<a href="https://twitter.com/pawslyy" target="_blank">Twitter</a>
<a href="https://t.me/pawslyy" target="_blank">Telegram</a>
<a href="https://www.roblox.com/users/profile?username=inwjecting" target="_blank">Roblox</a>
</div>
</div>

<div class="card">
<h3>catch the symbols ✧</h3>
<div id="gameArea"></div>
<p>score: <span id="score">0</span></p>
</div>

</div>

<div class="lace-bottom">⊹₊˚‧︵‿₊୨ᰔ୧₊‿︵‧˚₊⊹</div>

<audio id="bgMusic" autoplay loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<audio id="popSound">
<source src="https://assets.mixkit.co/sfx/preview/mixkit-bubble-pop-up-alert-notification-2357.mp3">
</audio>

<script>
window.addEventListener("click", () => {
  document.getElementById("bgMusic").play();
}, { once: true });

const symbols = ["♡","୨୧","✧","꒰","꒱","⋆"];

/* cursor trail */
document.addEventListener("mousemove", function(e) {
  const el = document.createElement("div");
  el.className = "symbol";
  el.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
  el.style.left = e.clientX + "px";
  el.style.top = e.clientY + "px";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1000);
});

/* falling symbols */
setInterval(() => {
  const fall = document.createElement("div");
  fall.className = "fall";
  fall.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
  fall.style.left = Math.random() * 100 + "vw";
  fall.style.animationDuration = (6 + Math.random() * 4) + "s";
  document.body.appendChild(fall);
  setTimeout(() => fall.remove(), 10000);
}, 800);

/* mini game */
let score = 0;
const gameArea = document.getElementById("gameArea");
const popSound = document.getElementById("popSound");

function spawnItem() {
  const item = document.createElement("div");
  item.className = "item";
  item.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];

  item.style.left = Math.random() * 90 + "%";
  item.style.top = Math.random() * 70 + "%";

  item.onclick = () => {
    popSound.currentTime = 0;
    popSound.play();
    score++;
    document.getElementById("score").innerText = score;
    item.remove();
  };

  gameArea.appendChild(item);
  setTimeout(() => item.remove(), 2400);
}

setInterval(spawnItem, 1100);
</script>

</body>
</html>
