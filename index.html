<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>pawslyy</title>

<style>
body{
  margin:0;
  background:#000;
  color:white;
  font-family:Arial;
  overflow:hidden;
  cursor:none;
}

/* CARD */
.card{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#111;
  padding:40px;
  border-radius:18px;
  text-align:center;
}

.bio{
  font-size:14px;
  opacity:.7;
  margin-top:6px;
}

/* ICONS */
.icons a{
  margin:10px;
  color:white;
  text-decoration:none;
  transition:.2s;
}
.icons a:hover{transform:scale(1.2);}

/* PLAYER */
.player{
  position:absolute;
  bottom:40px;
  left:50%;
  transform:translateX(-50%);
  background:#111;
  padding:20px;
  border-radius:14px;
}

/* FALLING HEARTS */
.heart{
  position:absolute;
  color:pink;
  animation:fall linear infinite;
}
@keyframes fall{
  to{transform:translateY(100vh); opacity:0;}
}

/* CLICK HEART */
.clickHeart{
  position:absolute;
  color:pink;
  pointer-events:none;
  animation:pop 1s forwards;
}
@keyframes pop{
  to{transform:translateY(-40px); opacity:0;}
}

/* STARS */
.star{
  position:absolute;
  width:2px;
  height:2px;
  background:white;
}

/* PLUSH */
.plush{
  position:absolute;
  cursor:pointer;
  animation:float 5s infinite ease-in-out;
}
@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-15px);}
}

/* BUNNY */
#bunny{
  position:absolute;
  bottom:20px;
  right:20px;
  font-size:36px;
  cursor:pointer;
}
.sleep{ opacity:.5; }

/* CURSOR TRAIL */
.trail{
  position:absolute;
  pointer-events:none;
  font-size:14px;
  opacity:.8;
  animation:fadeTrail .6s forwards;
}
@keyframes fadeTrail{
  to{opacity:0; transform:translateY(-10px);}
}
</style>
</head>

<body>

<div class="card">
<h1 id="typing"></h1>
<div class="bio">hi i love u ♡</div>

<div class="icons">
<a href="https://tiktok.com/@stupidbunie">TikTok</a>
<a href="https://x.com/pawslyy">Twitter</a>
<a href="https://t.me/pawslyy">Telegram</a>
<a href="https://www.roblox.com/users/2634203674/profile">Roblox</a>
</div>
</div>

<div class="player">
<audio id="audio" src="music.mp3" autoplay loop></audio>
u seemed so perfect
</div>

<div class="plush" style="left:20%;top:20%;">🧸</div>
<div class="plush" style="left:70%;top:30%;">🧸</div>

<div id="bunny" class="sleep">🐰</div>

<script>
/* TYPING */
let text="pawslyy";
let i=0;
function type(){
 if(i<text.length){
  document.getElementById("typing").innerHTML+=text.charAt(i);
  i++;
  setTimeout(type,120);
 }
}
type();

/* STARS */
for(let i=0;i<100;i++){
 let s=document.createElement("div");
 s.className="star";
 s.style.left=Math.random()*100+"vw";
 s.style.top=Math.random()*100+"vh";
 document.body.appendChild(s);
}

/* FALLING HEARTS */
setInterval(()=>{
 let h=document.createElement("div");
 h.className="heart";
 h.innerHTML="❤";
 h.style.left=Math.random()*100+"vw";
 h.style.animationDuration=(3+Math.random()*5)+"s";
 document.body.appendChild(h);
 setTimeout(()=>h.remove(),8000);
},500);

/* CLICK SPAWN HEART */
document.addEventListener("click",e=>{
 let h=document.createElement("div");
 h.className="clickHeart";
 h.innerHTML="❤";
 h.style.left=e.pageX+"px";
 h.style.top=e.pageY+"px";
 document.body.appendChild(h);
 setTimeout(()=>h.remove(),1000);
});

/* CURSOR TRAIL */
document.addEventListener("mousemove",e=>{
 let t=document.createElement("div");
 t.className="trail";
 t.innerHTML="❤";
 t.style.left=e.pageX+"px";
 t.style.top=e.pageY+"px";
 document.body.appendChild(t);
 setTimeout(()=>t.remove(),600);
});

/* PLUSH CLICK */
document.querySelectorAll(".plush").forEach(p=>{
 p.addEventListener("click",()=>{
  p.innerHTML="💗";
 });
});

/* BUNNY PET */
let bunny=document.getElementById("bunny");
let awake=false;
bunny.addEventListener("click",()=>{
 awake=!awake;
 bunny.classList.toggle("sleep");
 bunny.innerHTML=awake?"🐰✨":"🐰";
});

/* AUTOPLAY FIX */
let audio=document.getElementById("audio");
document.body.addEventListener("click",()=>{
 audio.play();
},{once:true});
</script>

</body>
</html>
