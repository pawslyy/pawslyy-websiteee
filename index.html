<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>pawslyy</title>

<style>
body{
margin:0;
background:black;
font-family:Arial;
color:white;
overflow:hidden;
}

/* CARD */
.card{
position:absolute;
top:40%;
left:50%;
transform:translate(-50%,-50%);
background:#111;
padding:50px;
border-radius:20px;
text-align:center;
width:420px;
}

/* LINKS (BLACK + WHITE) */
.links a{
margin:10px;
color:white;
text-decoration:none;
}
.links a:visited{color:white;}
.links a:hover{opacity:.6}

/* GAME */
#game{
position:absolute;
bottom:0;
width:100%;
height:140px;
background:#111;
overflow:hidden;
border-top:1px solid #333;
}

/* CLOUDS */
.cloud{
position:absolute;
font-size:28px;
opacity:.6;
}

/* RUNNER */
#runner{
position:absolute;
bottom:10px;
left:40px;
font-size:34px;
}

.obstacle{
position:absolute;
bottom:10px;
right:-20px;
font-size:24px;
}

#score{
position:absolute;
right:20px;
top:10px;
font-size:14px;
opacity:.7;
}
</style>
</head>
<body>

<audio id="music" src="music.mp3" autoplay loop></audio>
<audio id="jumpSfx" src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"></audio>
<audio id="hitSfx" src="https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg"></audio>

<div class="card">
<h1 id="title"></h1>
<div id="bio"></div>

<div class="links">
<a href="https://tiktok.com/@stupidbunie">TikTok</a>
<a href="https://x.com/pawslyy">Twitter</a>
<a href="https://t.me/pawslyy">Telegram</a>
<a href="https://www.roblox.com/users/2634203674/profile">Roblox</a>
</div>
</div>

<div id="game">
<div id="runner">🐰</div>
<div id="score">0</div>
</div>

<script>

/* TITLE TYPING LOOP */
let titleText="pawslyy";
let ti=0;
function titleLoop(){
title.innerHTML=titleText.substring(0,ti);
ti++; if(ti>titleText.length)ti=0;
setTimeout(titleLoop,150);
}
titleLoop();

/* BIO LOOP */
let bioText="hi i love u ♡";
let bi=0;
function bioLoop(){
bio.innerHTML=bioText.substring(0,bi);
bi++; if(bi>bioText.length)bi=0;
setTimeout(bioLoop,130);
}
bioLoop();

/* CLOUD BACKGROUND */
setInterval(()=>{
let cl=document.createElement("div");
cl.className="cloud";
cl.innerHTML="☁";
cl.style.top=Math.random()*50+"px";
cl.style.left=window.innerWidth+"px";
game.appendChild(cl);

let x=window.innerWidth;
let move=setInterval(()=>{
x-=1;
cl.style.left=x+"px";
if(x<-40){clearInterval(move);cl.remove();}
},30);
},2000);

/* MINI GAME */
let runner=document.getElementById("runner");
let scoreEl=document.getElementById("score");
let jumping=false;
let score=0;
let alive=true;
let skins=["🐰","🐇","🐱","🐶"];
let skin=0;

runner.onclick=()=>{
skin++;
if(skin>=skins.length)skin=0;
runner.innerHTML=skins[skin];
};

/* jump */
function jump(){
if(!jumping){
jumpSfx.play();
jumping=true;
let pos=10;
let up=setInterval(()=>{
pos+=6;
runner.style.bottom=pos+"px";
if(pos>70) clearInterval(up);
},20);

setTimeout(()=>{
let down=setInterval(()=>{
pos-=6;
runner.style.bottom=pos+"px";
if(pos<=10){
clearInterval(down);
jumping=false;
}
},20);
},300);
}
}

document.addEventListener("keydown",e=>{
if(e.code==="Space") jump();
});
document.addEventListener("touchstart",jump);

/* HIGH SCORE */
let best=localStorage.getItem("bestScore")||0;

/* obstacles */
function spawn(){
if(!alive)return;

let o=document.createElement("div");
o.className="obstacle";
o.innerHTML="🌵";
game.appendChild(o);

let x=window.innerWidth;

let move=setInterval(()=>{
x-=6;
o.style.right=(window.innerWidth-x)+"px";

let r=parseInt(runner.style.bottom||10);
if(x<90 && x>40 && r<25){
hitSfx.play();
alive=false;
best=Math.max(best,score);
localStorage.setItem("bestScore",best);
alert("pawslyy 1 — you 0 | best "+best);
location.reload();
}

if(x<0){
clearInterval(move);
o.remove();
score++;
scoreEl.innerHTML=score+" | best "+best;
}
},30);

setTimeout(spawn,1700);
}
spawn();

/* AUTOPLAY FIX */
window.addEventListener("click",()=>{
music.play();
},{once:true});

</script>
</body>
</html>
