<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pawslyy</title>

<style>
body {
  margin: 0;
  height: 100vh;
  font-family: Arial, sans-serif;
  color: white;

  background: url("background.jpg") center/cover no-repeat fixed;
  display: flex;
  align-items: center;
  justify-content: center;

  cursor: url("cursor.png"), auto;
}

.card {
  background: rgba(0,0,0,0.65);
  padding: 30px;
  border-radius: 16px;
  text-align: center;
  backdrop-filter: blur(8px);
}

h1 {
  margin: 0 0 18px 0;
  font-weight: 500;
}

.icons {
  display: flex;
  justify-content: center;
  gap: 14px;
}

.icon {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 1px solid white;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  color: white;
  transition: 0.2s;
}

.icon:hover {
  background: white;
  color: black;
}

/* music player */
.player {
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  width: 340px;
  background: rgba(0,0,0,0.75);
  border-radius: 16px;
  padding: 16px;
}

.equalizer {
  display: flex;
  gap: 4px;
  justify-content: center;
  margin-bottom: 10px;
}

.bar {
  width: 4px;
  height: 20px;
  background: white;
  animation: bounce 1s infinite ease-in-out;
}

.bar:nth-child(2){animation-delay:.1s}
.bar:nth-child(3){animation-delay:.2s}
.bar:nth-child(4){animation-delay:.3s}
.bar:nth-child(5){animation-delay:.4s}
.bar:nth-child(6){animation-delay:.5s}
.bar:nth-child(7){animation-delay:.6s}

@keyframes bounce {
  0%,100% { transform: scaleY(.3); }
  50% { transform: scaleY(1); }
}

audio {
  width: 100%;
}
</style>
</head>

<body>

<div class="card">
  <h1>pawslyy</h1>

  <div class="icons">
    <!-- TikTok -->
    <a class="icon" href="https://tiktok.com/@stupidbunie" target="_blank">♪</a>

    <!-- Twitter/X -->
    <a class="icon" href="https://twitter.com" target="_blank">X</a>

    <!-- Telegram -->
    <a class="icon" href="https://t.me" target="_blank">✉</a>

    <!-- Roblox -->
    <a class="icon" href="https://www.roblox.com/users/2634203674/profile" target="_blank">R</a>
  </div>
</div>

<div class="player">
  <div class="equalizer">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
  </div>

  <audio id="music" controls autoplay loop>
    <source src="music.mp3" type="audio/mpeg">
  </audio>
</div>

<script>
window.addEventListener("click", () => {
  document.getElementById("music").play();
});
</script>

</body>
</html>
