<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pawslyy</title>

<style>
:root{
--pink1:#eec7cf;
--pink2:#f3d5da;
--pink3:#f7e5e9;
--text:#b98f86;
--text2:#caa29a;
--glass: rgba(255,255,255,.45);
--glass2: rgba(255,255,255,.25);
--shadow:0 14px 40px rgba(180,140,130,.25);
--shadow2:0 10px 24px rgba(180,140,130,.18);
--radius:22px;
--radius2:16px;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:'Segoe UI',sans-serif;
background:url("bg.jpg") center/cover no-repeat fixed;
min-height:100vh;
overflow-x:hidden;
}

/* overlay tint for readability */
body::before{
content:"";
position:fixed;
inset:0;
background:rgba(255,255,255,0.35);
backdrop-filter:blur(2px);
z-index:-1;
}

.lace-header{
text-align:center;
padding:14px;
background:var(--glass);
color:var(--text2);
font-size:clamp(20px,4vw,36px);
animation:float 4s ease-in-out infinite;
}

@keyframes float{
0%,100%{transform:translateY(0)}
50%{transform:translateY(5px)}
}

.container{
width:min(720px,92vw);
margin:auto;
padding:20px;
display:flex;
flex-direction:column;
gap:16px;
}

.brand{
text-align:center;
font-size:clamp(22px,5vw,34px);
color:var(--text);
font-weight:bold;
}

.card{
background:var(--glass);
backdrop-filter:blur(12px);
padding:20px;
border-radius:var(--radius);
box-shadow:var(--shadow);
}

.socials{
display:flex;
flex-wrap:wrap;
gap:10px;
justify-content:center;
}

.socials a{
background:var(--pink2);
padding:12px 16px;
border-radius:14px;
text-decoration:none;
color:var(--text);
font-weight:bold;
transition:.2s;
}

.socials a:hover{
transform:scale(1.05);
}

.gameWrap{
height:200px;
background:var(--pink3);
border-radius:var(--radius2);
position:relative;
overflow:hidden;
border:2px solid var(--pink2);
}

#player{
position:absolute;
left:40px;
bottom:26px;
font-size:28px;
}

.jump{
animation:jump .45s ease;
}

@keyframes jump{
0%{transform:translateY(0)}
50%{transform:translateY(-80px)}
100%{transform:translateY(0)}
}

.ground{
position:absolute;
bottom:0;
width:100%;
height:22px;
background:var(--pink1);
}

.obstacle{
position:absolute;
bottom:24px;
font-size:28px;
right:-50px;
}

.hud{
display:flex;
justify-content:space-between;
margin-top:10px;
color:var(--text);
font-weight:bold;
}

.cursorDot{
position:fixed;
width:8px;
height:8px;
border-radius:50%;
background:var(--pink1);
pointer-events:none;
transform:translate(-50%,-50%);
z-index:9999;
}

.lace-bottom{
text-align:center;
padding:12px;
background:var(--glass);
color:var(--text2);
font-size:clamp(18px,3vw,26px);
}
</style>
</head>

<body>

<div class="lace-header">⊹₊˚‧︵‿₊୨ᰔ୧₊‿︵‧˚₊⊹</div>

<div class="container">

<div class="brand">Pawslyy</div>

<div class="card">
<div class="socials">
<a href="https://tiktok.com/@stupidbunie" target="_blank">TikTok</a>
<a href="https://twitter.com/pawslyy" target="_blank">Twitter</a>
<a href="https://t.me/pawslyy" target="_blank">Telegram</a>
<a href="https://www.roblox.com/users/profile?username=inwjecting" target="_blank">Roblox</a>
</div>
</div>

<div class="card">
<div class="gameWrap" id="game">
<div id="player">୨୧</div>
<div class="ground"></div>
</div>
<div class="hud">
<div>score: <span id="score">0</span></div>
<div>best: <span id="best">0</span></div>
</div>
</div>

</div>

<div class="lace-bottom">⊹₊˚‧︵‿₊୨ᰔ୧₊‿︵‧˚₊⊹</div>

<div class="cursorDot" id="cursorDot"></div>

<audio id="bgMusic" autoplay loop>
<source src="music.mp3">
</audio>

<script>
window.addEventListener("click",()=>bgMusic.play(),{once:true});

document.addEventListener("mousemove",e=>{
cursorDot.style.left=e.clientX+"px";
cursorDot.style.top=e.clientY+"px";
});

let score=0;
let best=localStorage.getItem("best")||0;
document.getElementById("best").textContent=best;

const player=document.getElementById("player");
const game=document.getElementById("game");
let jumping=false;
let running=true;
let speed=4;

function jump(){
if(jumping)return;
jumping=true;
player.classList.add("jump");
setTimeout(()=>{
player.classList.remove("jump");
jumping=false;
},450);
}

document.addEventListener("keydown",jump);
document.addEventListener("click",jump);

function spawnObstacle(){
const obs=document.createElement("div");
obs.className="obstacle";
obs.innerHTML="✿";
game.appendChild(obs);

let passed=false;
let x=-50;

const move=setInterval(()=>{

x+=speed;
obs.style.right=x+"px";

const pRect=player.getBoundingClientRect();
const oRect=obs.getBoundingClientRect();

const hit=
pRect.right-12>oRect.left &&
pRect.left+12<oRect.right &&
pRect.bottom-12>oRect.top &&
pRect.top+12<oRect.bottom;

if(hit){
running=false;
score=0;
document.getElementById("score").textContent=score;
obs.remove();
clearInterval(move);
running=true;
return;
}

if(!passed && oRect.right<pRect.left){
passed=true;
score++;
document.getElementById("score").textContent=score;
if(score>best){
best=score;
localStorage.setItem("best",best);
document.getElementById("best").textContent=best;
}
}

if(oRect.right<0){
obs.remove();
clearInterval(move);
}

},16);
}

setInterval(spawnObstacle,2000);
</script>

</body>
</html>
