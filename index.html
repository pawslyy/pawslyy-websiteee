<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pawslyy</title>

<style>
* {box-sizing:border-box;margin:0;padding:0}

body{
background:linear-gradient(180deg,#fff6fb,#ffeaf5);
font-family:'Segoe UI',sans-serif;
display:flex;
flex-direction:column;
align-items:center;
min-height:100vh;
overflow-x:hidden;
}

/* header */
.lace{
font-size:clamp(18px,4vw,32px);
padding:16px;
color:#f4a6c0;
animation:float 4s ease-in-out infinite;
}

@keyframes float{
0%{transform:translateY(0)}
50%{transform:translateY(6px)}
100%{transform:translateY(0)}
}

/* layout */
.wrapper{
width:95%;
max-width:650px;
margin-top:20px;
display:flex;
flex-direction:column;
gap:20px;
}

/* glass card */
.card{
background:rgba(255,255,255,0.5);
backdrop-filter:blur(14px);
padding:22px;
border-radius:22px;
box-shadow:0 8px 30px rgba(255,182,214,0.25);
animation:fadeUp .7s ease;
}

@keyframes fadeUp{
from{opacity:0;transform:translateY(10px)}
to{opacity:1;transform:translateY(0)}
}

/* socials */
.socials{
display:flex;
flex-wrap:wrap;
gap:10px;
justify-content:center;
}

.socials a{
background:#ffd6ec;
padding:12px 18px;
border-radius:14px;
text-decoration:none;
color:#c96f9c;
font-weight:bold;
transition:.2s;
}

.socials a:hover{
transform:scale(1.07);
}

/* pixel game */
#game{
height:180px;
background:#fff0f8;
border-radius:14px;
position:relative;
overflow:hidden;
border:3px solid #ffd6ec;
}

#player{
position:absolute;
bottom:0;
left:40px;
font-size:30px;
}

.ground{
position:absolute;
bottom:0;
width:100%;
height:8px;
background:#ffc8dd;
}

.obstacle{
position:absolute;
bottom:0;
font-size:26px;
right:-30px;
}

.jump{
animation:jump .45s ease;
}

@keyframes jump{
0%{bottom:0}
50%{bottom:75px}
100%{bottom:0}
}

/* sparkle cursor */
.spark{
position:fixed;
pointer-events:none;
font-size:10px;
opacity:.5;
animation:fade .8s forwards;
}

@keyframes fade{
to{transform:translateY(-10px);opacity:0}
}

.score{
margin-top:8px;
color:#d88fb3;
}
</style>
</head>

<body>

<div class="lace">⊹₊˚‧︵‿₊୨ᰔ୧₊‿︵‧˚₊⊹</div>

<div class="wrapper">

<div class="card">
<div class="socials">
<a href="https://tiktok.com/@stupidbunie" target="_blank">TikTok</a>
<a href="https://twitter.com/pawslyy" target="_blank">Twitter</a>
<a href="https://t.me/pawslyy" target="_blank">Telegram</a>
<a href="https://www.roblox.com/users/profile?username=inwjecting" target="_blank">Roblox</a>
</div>
</div>

<div class="card">
<div id="game">
<div id="player">୨୧</div>
<div class="ground"></div>
</div>
<div class="score">score: <span id="score">0</span></div>
</div>

</div>

<audio id="bgMusic" autoplay loop>
<source src="music.mp3">
</audio>

<audio id="jumpS">
<source src="https://assets.mixkit.co/sfx/preview/mixkit-quick-jump-arcade-game-239.mp3">
</audio>

<audio id="hitS">
<source src="https://assets.mixkit.co/sfx/preview/mixkit-retro-arcade-lose-2027.mp3">
</audio>

<script>
window.addEventListener("click",()=>{
bgMusic.play();
},{once:true})

/* sparkle cursor */
document.addEventListener("mousemove",e=>{
const s=document.createElement("div");
s.className="spark";
s.innerHTML="✧";
s.style.left=e.clientX+"px";
s.style.top=e.clientY+"px";
document.body.appendChild(s);
setTimeout(()=>s.remove(),800);
})

/* jump game */
let jumping=false;
let score=0;
const player=document.getElementById("player");

function jump(){
if(jumping)return;
jumping=true;
jumpS.play();
player.classList.add("jump");
setTimeout(()=>{
player.classList.remove("jump");
jumping=false;
},450);
}

document.addEventListener("keydown",jump);
document.addEventListener("click",jump);

function spawn(){
const obs=document.createElement("div");
obs.className="obstacle";
obs.innerHTML="✿";
document.getElementById("game").appendChild(obs);

let pos=0;
let move=setInterval(()=>{
pos+=4;
obs.style.right=pos+"px";

let playerBottom=parseInt(getComputedStyle(player).bottom);
if(pos>50&&pos<80&&playerBottom<20){
hitS.play();
score=0;
document.getElementById("score").innerText=score;
clearInterval(move);
obs.remove();
}

if(pos>window.innerWidth){
score++;
document.getElementById("score").innerText=score;
clearInterval(move);
obs.remove();
}
},20);
}

setInterval(spawn,2200);
</script>

</body>
</html>
