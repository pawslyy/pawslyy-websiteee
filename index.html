<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>pawslyy</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>
:root{
  --scale: 1.25;
  --pink: #ffd1dc;          /* ✅ your hex */
  --pink50: rgba(255,209,220,0.50); /* ✅ 50% */
}

*{ margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }

body{
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#000; /* ✅ plain black */
}

/* ✅ stop purple underline/visited */
a, a:link, a:visited, a:hover, a:active{
  color: inherit;
  text-decoration: none !important;
}

/* 🌸 card */
.card{
  z-index:2;
  width: calc(520px * var(--scale));
  padding: calc(34px * var(--scale));
  border-radius: 26px;
  text-align:center;

  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(10px);

  border: 1px solid var(--pink50);
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.06),
    0 0 55px rgba(255,209,220,0.18),
    0 22px 70px rgba(0,0,0,0.70);
}

.name{
  font-size: 34px;
  color:#fff;
  font-weight: 500;
  margin-bottom: 18px;
  text-shadow: 0 8px 24px rgba(0,0,0,0.45);
}

/* icons */
.icons{
  display:flex;
  justify-content:center;
  gap: 30px;
  margin-bottom: 16px;
}

.icons a{
  width: 52px;
  height: 52px;
  display:grid;
  place-items:center;
  border-radius: 999px;

  background: rgba(255,255,255,0.05);
  border: 1px solid var(--pink50);
  box-shadow: 0 12px 30px rgba(0,0,0,0.45);
  transition: transform .25s ease, background .25s ease, box-shadow .25s ease;
}

.icons a i{
  color: var(--pink);
  font-size: 22px;
}

.icons a:hover{
  transform: scale(1.12);
  background: rgba(255,255,255,0.10);
  box-shadow: 0 0 28px rgba(255,209,220,0.22), 0 16px 35px rgba(0,0,0,0.55);
}

/* 🎧 tiny bars */
.visualizer{
  display:flex;
  justify-content:center;
  gap: 6px;
  margin-top: 6px;
  opacity: 0.9;
}
.bar{
  width: 6px;
  height: 18px;
  background: rgba(255,209,220,0.70);
  border-radius: 999px;
  animation: beat 1s infinite ease-in-out;
}
.bar:nth-child(2){ animation-delay: .2s; }
.bar:nth-child(3){ animation-delay: .4s; }
.bar:nth-child(4){ animation-delay: .6s; }
@keyframes beat{
  0%,100%{ height: 10px; opacity:.55; }
  50%{ height: 26px; opacity:1; }
}

/* 🎵 music player */
.player{
  width: min(860px, 92vw);
  position: fixed;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%);
  z-index: 3;

  padding: 14px 16px;
  border-radius: 18px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(10px);
  box-shadow: 0 18px 45px rgba(0,0,0,0.65);
  border: 1px solid var(--pink50);
}

.playerTop{
  display:flex;
  justify-content: space-between;
  align-items:center;
  gap: 12px;
  margin-bottom: 10px;
}

.trackTitle{
  color: rgba(255,255,255,0.95);
  font-size: 16px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 45vw;
}

.timeRow{
  display:flex;
  align-items:center;
  gap: 10px;
  color: rgba(255,255,255,0.88);
  font-size: 14px;
  white-space: nowrap;
}

.playBtn{
  width: 40px;
  height: 40px;
  border-radius: 999px;
  border: 1px solid var(--pink50);
  background: rgba(255,255,255,0.06);
  color: var(--pink);
  cursor:pointer;
  display:grid;
  place-items:center;
  transition: transform .2s ease, background .2s ease;
}
.playBtn:hover{
  transform: scale(1.06);
  background: rgba(255,255,255,0.10);
}

.progressWrap{
  width: 100%;
  height: 10px;
  border-radius: 999px;
  background: rgba(255,255,255,0.10);
  overflow: hidden;
  cursor: pointer;
}
.progressFill{
  height: 100%;
  width: 0%;
  background: rgba(255,209,220,0.75);
  border-radius: 999px;
}

.tapHint{
  margin-top: 8px;
  color: rgba(255,209,220,0.85);
  font-size: 12px;
  text-align:center;
  display:none;
}
.tapHint.show{ display:block; }

/* 💘 Cupid heart (top-right) */
.cupid{
  position: fixed;
  top: 18px;
  right: 18px;
  z-index: 4;
  width: 120px;
  height: 120px;
  opacity: 0.95;
  filter: drop-shadow(0 0 18px rgba(255,209,220,0.25));
}

.cupid .pulse{
  transform-origin: center;
  animation: pulse 2.2s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{ transform: scale(1); }
  50%{ transform: scale(1.06); }
}
</style>
</head>

<body>

<!-- 💘 cute heart + cupid bow -->
<svg class="cupid" viewBox="0 0 200 200" aria-hidden="true">
  <g class="pulse">
    <!-- heart -->
    <path d="M100 160
             C 65 140, 40 120, 40 90
             C 40 65, 60 50, 80 50
             C 92 50, 100 58, 100 66
             C 100 58, 108 50, 120 50
             C 140 50, 160 65, 160 90
             C 160 120, 135 140, 100 160 Z"
          fill="#ffd1dc" opacity="0.95"/>
    <!-- bow (simple cute bow) -->
    <path d="M40 100 C20 90, 20 110, 40 100 Z" fill="#ffd1dc" opacity="0.85"/>
    <path d="M160 100 C180 90, 180 110, 160 100 Z" fill="#ffd1dc" opacity="0.85"/>
    <circle cx="100" cy="100" r="10" fill="#ffd1dc" opacity="0.95"/>
    <!-- arrow -->
    <path d="M25 105 L175 95" stroke="#ffd1dc" stroke-width="6" stroke-linecap="round" opacity="0.75"/>
    <path d="M170 88 L180 95 L170 102" fill="none" stroke="#ffd1dc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>
  </g>
</svg>

<div class="card">
  <div class="name">pawslyy</div>

  <div class="icons">
    <a href="https://www.tiktok.com/@stupidbunie" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
      <i class="fa-brands fa-tiktok"></i>
    </a>
    <a href="https://x.com/pawslyy" target="_blank" rel="noopener noreferrer" aria-label="X">
      <i class="fa-brands fa-x-twitter"></i>
    </a>
    <a href="https://t.me/pawslyy" target="_blank" rel="noopener noreferrer" aria-label="Telegram">
      <i class="fa-brands fa-telegram"></i>
    </a>
  </div>

  <div class="visualizer" aria-hidden="true">
    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
  </div>
</div>

<audio id="music" preload="auto" loop playsinline>
  <source src="./music.mp3" type="audio/mpeg">
</audio>

<div class="player" id="player">
  <div class="playerTop">
    <div class="trackTitle" id="trackTitle">u seemed so perfect</div>

    <div class="timeRow">
      <span id="curTime">0:00</span>
      <span style="opacity:.6;">—</span>
      <span id="durTime">0:00</span>
    </div>

    <button class="playBtn" id="playBtn" aria-label="Play/Pause">
      <i class="fa-solid fa-play" id="playIcon"></i>
    </button>
  </div>

  <div class="progressWrap" id="progressWrap" aria-label="Seek">
    <div class="progressFill" id="progressFill"></div>
  </div>

  <div class="tapHint" id="tapHint">tap anywhere to start sound</div>
</div>

<script>
/* music (autoplay attempt + fallback) */
const music = document.getElementById("music");
const playBtn = document.getElementById("playBtn");
const playIcon = document.getElementById("playIcon");
const curTime = document.getElementById("curTime");
const durTime = document.getElementById("durTime");
const progressFill = document.getElementById("progressFill");
const progressWrap = document.getElementById("progressWrap");
const tapHint = document.getElementById("tapHint");

function fmt(t){
  if(!isFinite(t)) return "0:00";
  const m = Math.floor(t/60);
  const s = Math.floor(t%60).toString().padStart(2,"0");
  return `${m}:${s}`;
}
function setPlayUI(isPlaying){
  playIcon.className = isPlaying ? "fa-solid fa-pause" : "fa-solid fa-play";
}
async function tryPlay(){
  try{
    await music.play();
    setPlayUI(true);
    tapHint.classList.remove("show");
  }catch(e){
    tapHint.classList.add("show");
    setPlayUI(false);
  }
}

playBtn.addEventListener("click", async (e) => {
  e.stopPropagation();
  if(music.paused) await tryPlay();
  else { music.pause(); setPlayUI(false); }
});

music.addEventListener("loadedmetadata", () => {
  durTime.textContent = fmt(music.duration);
});
music.addEventListener("timeupdate", () => {
  curTime.textContent = fmt(music.currentTime);
  const pct = (music.currentTime / (music.duration || 1)) * 100;
  progressFill.style.width = pct + "%";
});

/* seek */
progressWrap.addEventListener("click", (e) => {
  const rect = progressWrap.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const pct = Math.min(Math.max(x / rect.width, 0), 1);
  music.currentTime = pct * (music.duration || 0);
});

/* autoplay on load (may be blocked) */
tryPlay();

/* if blocked, any click starts it */
function unlock(){
  if(music.paused) tryPlay();
  document.removeEventListener("click", unlock);
  document.removeEventListener("touchstart", unlock);
}
document.addEventListener("click", unlock, { passive:true });
document.addEventListener("touchstart", unlock, { passive:true });

setPlayUI(false);
</script>

</body>
</html>
