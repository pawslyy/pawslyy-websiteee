<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>pawslyy</title>

<style>
body{
margin:0;
background:black;
color:white;
font-family:Arial;
overflow:hidden;
}

/* CARD */
.card{
position:absolute;
top:35%;
left:50%;
transform:translate(-50%,-50%);
background:#111;
padding:50px;
border-radius:20px;
text-align:center;
width:420px;
}

.links a{
margin:10px;
color:white;
text-decoration:none;
opacity:.8;
}
.links a:hover{opacity:1}

/* MUSIC BAR */
.musicbar{
position:absolute;
bottom:160px;
left:50%;
transform:translateX(-50%);
background:#111;
padding:14px 20px;
border-radius:12px;
width:340px;
display:flex;
align-items:center;
justify-content:space-between;
}

button{
background:white;
border:none;
border-radius:50%;
width:28px;
height:28px;
cursor:pointer;
}

/* VISUALIZER */
canvas{
position:absolute;
bottom:120px;
left:0;
width:100%;
height:40px;
}

/* GAME */
#game{
position:absolute;
bottom:0;
width:100%;
height:120px;
border-top:1px solid #333;
}

#runner{
position:absolute;
bottom:10px;
left:40px;
font-size:32px;
}

.obstacle{
position:absolute;
bottom:10px;
right:-20px;
}

#score{
position:absolute;
right:20px;
top:10px;
opacity:.6;
}

#lose{
position:absolute;
top:30%;
left:50%;
transform:translateX(-50%);
display:none;
text-align:center;
}
</style>
</head>
<body>

<audio id="music" src="music.mp3" autoplay loop></audio>

<div class="card">
<h1>pawslyy</h1>
<div>hi i love u ♡</div>

<div class="links">
<a href="https://tiktok.com/@stupidbunie">TikTok</a>
<a href="https://x.com/pawslyy">Twitter</a>
<a href="https://t.me/pawslyy">Telegram</a>
<a href="https://www.roblox.com/users/2634203674/profile">Roblox</a>
</div>
</div>

<div class="musicbar">
<button id="play">▶</button>
<div>u seemed so perfect</div>
</div>

<canvas id="viz"></canvas>

<div id="game">
<div id="runner">🐰</div>
<div id="score">0</div>
</div>

<div id="lose">
<h2>pawslyy 1 — you 0</h2>
<button onclick="restart()">retry</button>
</div>

<script>
/* MUSIC CONTROLS */
let audio=document.getElementById("music");
document.getElementById("play").onclick=()=>{
if(audio.paused){audio.play();play.innerHTML="⏸";}
else{audio.pause();play.innerHTML="▶";}
};
window.addEventListener("click",()=>audio.play(),{once:true});

/* VISUALIZER */
let ctx=new AudioContext();
let src=ctx.createMediaElementSource(audio);
let analyser=ctx.createAnalyser();
src.connect(analyser);
analyser.connect(ctx.destination);
analyser.fftSize=64;

let canvas=document.getElementById("viz");
let c=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=40;
let data=new Uint8Array(analyser.frequencyBinCount);

function draw(){
requestAnimationFrame(draw);
analyser.getByteFrequencyData(data);
c.clearRect(0,0,canvas.width,40);
for(let i=0;i<data.length;i++){
c.fillRect(i*8,40-data[i]/4,5,data[i]/4);
}
}
draw();

/* GAME */
let runner=document.getElementById("runner");
let scoreEl=document.getElementById("score");
let jumping=false;
let score=0;
let alive=true;

document.addEventListener("keydown",e=>{
if(e.code==="Space"&&!jumping){
jumping=true;
let pos=10;
let up=setInterval(()=>{
pos+=6;
runner.style.bottom=pos+"px";
if(pos>70) clearInterval(up);
},20);

setTimeout(()=>{
let down=setInterval(()=>{
pos-=6;
runner.style.bottom=pos+"px";
if(pos<=10){
clearInterval(down);
jumping=false;
}
},20);
},300);
}
});

function spawn(){
if(!alive)return;

let o=document.createElement("div");
o.className="obstacle";
o.innerHTML="🌵";
game.appendChild(o);

let x=window.innerWidth;

let move=setInterval(()=>{
x-=6;
o.style.right=(window.innerWidth-x)+"px";

let r=parseInt(runner.style.bottom||10);
if(x<90 && x>40 && r<25){
alive=false;
document.getElementById("lose").style.display="block";
clearInterval(move);
}

if(x<0){
clearInterval(move);
o.remove();
score++;
scoreEl.innerHTML=score;
}
},30);

setTimeout(spawn,1800);
}
spawn();

function restart(){
location.reload();
}
</script>
</body>
</html>
