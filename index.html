<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>pawslyy</title>

<style>
body{
  margin:0;
  background:black;
  font-family:Arial, Helvetica, sans-serif;
  color:white;
  overflow:hidden;
}

/* background canvas */
canvas{
  position:fixed;
  top:0;
  left:0;
  z-index:0;
}

/* card */
.card{
  position:absolute;
  top:45%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#0a0a0a;
  border-radius:18px;
  padding:50px 70px;
  text-align:center;
  z-index:2;
  animation:float 4s ease-in-out infinite;
}

@keyframes float{
  0%{transform:translate(-50%,-50%)}
  50%{transform:translate(-50%,-52%)}
  100%{transform:translate(-50%,-50%)}
}

h1{
  margin-bottom:20px;
  font-size:36px;
}

.bio{
  margin-bottom:30px;
  opacity:.85;
}

.links a{
  color:white;
  text-decoration:none;
  margin:0 15px;
  font-size:15px;
}

.links a:hover{
  opacity:.6;
}

/* game */
#game{
  position:absolute;
  bottom:0;
  width:100%;
  height:200px;
  background:#111;
  overflow:hidden;
}

.bunny{
  position:absolute;
  bottom:10px;
  left:50px;
  width:40px;
  height:40px;
  background:white;
  border-radius:50%;
}

.obstacle{
  position:absolute;
  bottom:10px;
  width:20px;
  height:40px;
  background:white;
}

.coin{
  position:absolute;
  bottom:70px;
  width:15px;
  height:15px;
  background:gold;
  border-radius:50%;
}

/* falling snow */
.snow{
  position:fixed;
  top:-10px;
  color:white;
  font-size:10px;
  animation:fall linear forwards;
}

@keyframes fall{
  to{ transform:translateY(110vh); }
}

.score{
  position:absolute;
  right:20px;
  bottom:210px;
}
</style>
</head>

<body>

<canvas id="stars"></canvas>

<div class="card">
  <h1>pawslyy</h1>
  <div class="bio">hi i love u ♡</div>

  <div class="links">
    <a href="https://tiktok.com/@stupidbunie">TikTok</a>
    <a href="https://x.com/pawslyy">Twitter</a>
    <a href="https://t.me/pawslyy">Telegram</a>
    <a href="https://www.roblox.com/users/2634203674/profile">Roblox</a>
  </div>
</div>

<div id="game">
  <div class="bunny" id="bunny"></div>
</div>

<div class="score">
score: <span id="score">0</span> |
coins: <span id="coins">0</span>
</div>

<audio id="music" autoplay loop>
  <source src="music.mp3">
</audio>

<audio id="jumpSfx" src="https://cdn.pixabay.com/audio/2022/03/15/audio_jump.wav"></audio>
<audio id="coinSfx" src="https://cdn.pixabay.com/audio/2022/03/10/audio_coin.wav"></audio>
<audio id="hitSfx" src="https://cdn.pixabay.com/audio/2022/03/15/audio_error.wav"></audio>

<script>
/* autoplay fallback */
window.addEventListener("click",()=>{
  document.getElementById("music").play();
},{once:true});

/* stars background */
const canvas=document.getElementById("stars");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let stars=[];
for(let i=0;i<100;i++){
  stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height});
}

function drawStars(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="white";
  stars.forEach(s=>ctx.fillRect(s.x,s.y,2,2));
  requestAnimationFrame(drawStars);
}
drawStars();

/* snow */
setInterval(()=>{
  const snow=document.createElement("div");
  snow.className="snow";
  snow.innerText="•";
  snow.style.left=Math.random()*100+"vw";
  snow.style.animationDuration=4+Math.random()*6+"s";
  document.body.appendChild(snow);
  setTimeout(()=>snow.remove(),8000);
},250);

/* runner game */
const bunny=document.getElementById("bunny");
const game=document.getElementById("game");

let jumping=false;
let velocity=0;
let gravity=.8;
let score=0;
let coins=0;

function jump(){
  if(!jumping){
    velocity=12;
    jumping=true;
    jumpSfx.currentTime=0;
    jumpSfx.play();
  }
}

document.addEventListener("keydown",e=>{
  if(e.code==="Space") jump();
});

document.addEventListener("click",jump);

function update(){
  velocity-=gravity;
  let bottom=parseInt(bunny.style.bottom||10)+velocity;

  if(bottom<=10){
    bottom=10;
    jumping=false;
  }

  bunny.style.bottom=bottom+"px";

  requestAnimationFrame(update);
}
update();

/* obstacles */
setInterval(()=>{
  const o=document.createElement("div");
  o.className="obstacle";
  o.style.left="100%";
  game.appendChild(o);

  let pos=window.innerWidth;

  const move=setInterval(()=>{
    pos-=6;
    o.style.left=pos+"px";

    const bRect=bunny.getBoundingClientRect();
    const oRect=o.getBoundingClientRect();

    if(!(bRect.right<oRect.left || bRect.left>oRect.right ||
         bRect.bottom<oRect.top || bRect.top>oRect.bottom)){
      hitSfx.play();
      alert("pawslyy 1 — you 0");
      location.reload();
    }

    if(pos<-20){
      clearInterval(move);
      o.remove();
      score++;
      document.getElementById("score").innerText=score;
    }
  },20);
},2000);

/* coins */
setInterval(()=>{
  const c=document.createElement("div");
  c.className="coin";
  c.style.left="100%";
  game.appendChild(c);

  let pos=window.innerWidth;

  const move=setInterval(()=>{
    pos-=6;
    c.style.left=pos+"px";

    const bRect=bunny.getBoundingClientRect();
    const cRect=c.getBoundingClientRect();

    if(!(bRect.right<cRect.left || bRect.left>cRect.right ||
         bRect.bottom<cRect.top || bRect.top>cRect.bottom)){
      coins++;
      coinSfx.play();
      document.getElementById("coins").innerText=coins;
      c.remove();
      clearInterval(move);
    }

    if(pos<-20){
      c.remove();
      clearInterval(move);
    }
  },20);
},3500);
</script>

</body>
</html>
