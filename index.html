<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>pawslyy</title>

<style>
body{
  margin:0;
  background:black;
  font-family:Arial, sans-serif;
  color:white;
  overflow:hidden;
}

/* stars */
.star{
  position:fixed;
  width:2px;
  height:2px;
  background:white;
  opacity:.8;
  border-radius:50%;
}

/* falling hearts */
.heart{
  position:fixed;
  color:#ffd1dc;
  animation:fall 6s linear infinite;
}
@keyframes fall{
  from{transform:translateY(-20px)}
  to{transform:translateY(110vh)}
}

/* main card */
.card{
  position:absolute;
  top:40%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#111;
  padding:40px 70px;
  border-radius:18px;
  text-align:center;
}

/* links */
.links a{
  margin:0 10px;
  color:white;
  text-decoration:none;
}
.links a:hover{
  opacity:.6;
}

/* music bar */
.player{
  position:absolute;
  bottom:140px;
  left:50%;
  transform:translateX(-50%);
  background:#111;
  padding:10px 20px;
  border-radius:14px;
}

/* game */
#game{
  position:absolute;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  background:#000;
}
</style>
</head>

<body>

<audio id="song" src="music.mp3" autoplay loop></audio>

<div class="card">
  <h1>pawslyy</h1>
  <div>hi i love u ♡</div>

  <div class="links">
    <a href="https://tiktok.com" target="_blank">TikTok</a>
    <a href="https://x.com/pawslyy" target="_blank">Twitter</a>
    <a href="https://t.me/pawslyy" target="_blank">Telegram</a>
    <a href="https://www.roblox.com/users/2634203674/profile" target="_blank">Roblox</a>
  </div>
</div>

<div class="player">
  u seemed so perfect
  <input type="range" min="0" max="1" step="0.01"
    value="1"
    oninput="song.volume=this.value">
</div>

<canvas id="game" width="400" height="150"></canvas>

<script>
/* stars */
for(let i=0;i<80;i++){
  let s=document.createElement("div");
  s.className="star";
  s.style.left=Math.random()*100+"vw";
  s.style.top=Math.random()*100+"vh";
  document.body.appendChild(s);
}

/* falling hearts */
setInterval(()=>{
  let h=document.createElement("div");
  h.className="heart";
  h.innerHTML="♡";
  h.style.left=Math.random()*100+"vw";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),6000);
},600);

/* heart cursor trail */
document.addEventListener("mousemove",e=>{
  let t=document.createElement("div");
  t.innerHTML="♡";
  t.style.position="fixed";
  t.style.left=e.clientX+"px";
  t.style.top=e.clientY+"px";
  t.style.color="#ffd1dc";
  t.style.fontSize="12px";
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),500);
});

/* bunny runner game */
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let bunny={x:50,y:110,w:20,h:20,vy:0,jumping:false};
let obstacles=[];
let gravity=.6;
let ground=110;
let score=0;
let frame=0;

let jumpSound=new Audio("music.mp3");
jumpSound.volume=.05;

function spawn(){
  obstacles.push({x:400,y:115,w:12,h:15});
}

function loop(){
  ctx.clearRect(0,0,400,150);

  ctx.fillStyle="#222";
  ctx.fillRect(0,130,400,20);

  bunny.vy+=gravity;
  bunny.y+=bunny.vy;

  if(bunny.y>=ground){
    bunny.y=ground;
    bunny.jumping=false;
  }

  ctx.fillStyle="white";
  ctx.fillRect(bunny.x,bunny.y,bunny.w,bunny.h);

  if(frame%90===0) spawn();

  obstacles.forEach((o,i)=>{
    o.x-=4;
    ctx.fillRect(o.x,o.y,o.w,o.h);

    if(
      bunny.x<o.x+o.w &&
      bunny.x+bunny.w>o.x &&
      bunny.y<o.y+o.h &&
      bunny.y+bunny.h>o.y
    ){
      obstacles=[];
      score=0;
    }

    if(o.x<-20){
      obstacles.splice(i,1);
      score++;
    }
  });

  ctx.fillText("score: "+score,10,12);

  frame++;
  requestAnimationFrame(loop);
}
loop();

function jump(){
  if(!bunny.jumping){
    bunny.vy=-10;
    bunny.jumping=true;
    jumpSound.play();
  }
}

document.addEventListener("keydown",jump);
canvas.addEventListener("touchstart",jump);
</script>

</body>
</html>
