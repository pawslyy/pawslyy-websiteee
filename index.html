<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let bunny = {
  x: 50,
  y: 110,
  w: 20,
  h: 20,
  vy: 0,
  jumping: false
};

let gravity = 0.6;
let ground = 110;

let obstacles = [];
let frame = 0;
let score = 0;

let jumpSound = new Audio("music.mp3");
jumpSound.volume = 0.1;

function spawnObstacle(){
  obstacles.push({
    x: canvas.width,
    y: 115,
    w: 12,
    h: 15
  });
}

function update(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  /* ground */
  ctx.fillStyle="#222";
  ctx.fillRect(0,130,canvas.width,20);

  /* bunny physics */
  bunny.vy += gravity;
  bunny.y += bunny.vy;

  if(bunny.y >= ground){
    bunny.y = ground;
    bunny.jumping = false;
  }

  /* bunny */
  ctx.fillStyle="white";
  ctx.fillRect(bunny.x, bunny.y, bunny.w, bunny.h);

  /* obstacles */
  if(frame % 90 === 0){
    spawnObstacle();
  }

  for(let i=0;i<obstacles.length;i++){
    let o = obstacles[i];
    o.x -= 4;

    ctx.fillRect(o.x, o.y, o.w, o.h);

    /* collision */
    if(
      bunny.x < o.x + o.w &&
      bunny.x + bunny.w > o.x &&
      bunny.y < o.y + o.h &&
      bunny.y + bunny.h > o.y
    ){
      obstacles = [];
      score = 0;
    }

    if(o.x < -20){
      obstacles.splice(i,1);
      score++;
    }
  }

  ctx.fillStyle="white";
  ctx.fillText("score: " + score, 10, 12);

  frame++;
  requestAnimationFrame(update);
}

update();

/* jump controls */
function jump(){
  if(!bunny.jumping){
    bunny.vy = -10;
    bunny.jumping = true;
    jumpSound.play();
  }
}

document.addEventListener("keydown", jump);
canvas.addEventListener("touchstart", jump);
</script>
