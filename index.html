<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pawslyy</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:url("waaalalallala.jpg") center/cover no-repeat;
  font-family:Arial, Helvetica, sans-serif;
  cursor: url("cursor.png") 16 16, auto;
}

/* dark overlay */
body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.55);
  z-index:-1;
}

/* main card */
.card{
  background:rgba(0,0,0,0.85);
  border-radius:18px;
  padding:40px;
  text-align:center;
  color:white;
  width:260px;
}

/* title */
h1{
  margin:0 0 20px 0;
  font-weight:500;
}

/* icons */
.icons{
  display:flex;
  gap:14px;
  justify-content:center;
}

.icon{
  width:42px;
  height:42px;
  border-radius:50%;
  border:1px solid white;
  display:flex;
  justify-content:center;
  align-items:center;
  cursor:pointer;
  transition:0.2s;
}

.icon:hover{
  background:white;
  color:black;
}

/* music player */
.music{
  position:fixed;
  bottom:40px;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,0.85);
  padding:18px 22px;
  border-radius:14px;
  color:white;
  width:320px;
}
</style>
</head>

<body>

<div class="card">
  <h1>pawslyy</h1>

  <div class="icons">
    <div class="icon">♪</div>
    <div class="icon">X</div>
    <div class="icon">✉</div>
  </div>
</div>

<div class="music">
  u seemed so perfect
  <audio autoplay controls>
    <source src="music.mp3" type="audio/mpeg">
  </audio>
</div>

</body>
</html>
