<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>pawslyy</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;

    background-image: url("anime-bg.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    cursor: url("cursor.png"), auto;

    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* dark overlay */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
}

/* card */
.card {
    position: relative;
    background: rgba(0,0,0,0.75);
    border-radius: 22px;
    padding: 40px 60px;
    text-align: center;
    color: #ffd1dc;
    border: 1px solid #ffd1dc;
    backdrop-filter: blur(10px);
}

/* title */
h1 {
    margin-bottom: 20px;
    color: #ffd1dc;
}

/* icons */
.icons {
    display: flex;
    justify-content: center;
    gap: 20px;
}

.icon {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 1px solid #ffd1dc;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffd1dc;
    transition: 0.3s;
}

.icon:hover {
    transform: scale(1.1);
    background: #ffd1dc;
    color: black;
}

/* music player */
.player {
    position: absolute;
    bottom: 40px;
    left: 50%;
    transform: translateX(-50%);
    width: 340px;
    background: rgba(0,0,0,0.75);
    border-radius: 20px;
    padding: 14px;
    border: 1px solid #ffd1dc;
    color: #ffd1dc;
}
</style>
</head>

<body>

<div class="card">
    <h1>pawslyy</h1>

    <div class="icons">
        <a href="https://tiktok.com/@stupidbunie" class="icon">
            <i class="fab fa-tiktok"></i>
        </a>

        <a href="#" class="icon">
            <i class="fab fa-x-twitter"></i>
        </a>

        <a href="#" class="icon">
            <i class="fab fa-telegram"></i>
        </a>
    </div>
</div>

<div class="player">
    <div>u seemed so perfect</div>
    <audio autoplay controls>
        <source src="music.mp3" type="audio/mpeg">
    </audio>
</div>

</body>
</html>
