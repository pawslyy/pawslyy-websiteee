<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pawslyy</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root { --scale: 1.3; }

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  background: url("wp13418322-sweet-4k-wallpapers.png") no-repeat center/cover;
}

/* 🌧️ Rain */
.rain, .sparkles {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
}

.drop {
  position: absolute;
  top: -10vh;
  width: 6px;
  height: 12px;
  border-radius: 999px;
  background: rgba(255,255,255,0.35);
  animation: fall linear infinite;
}

@keyframes fall {
  to { transform: translateY(130vh); }
}

/* ✨ Sparkles */
.sparkle {
  position: absolute;
  color: rgba(255,255,255,0.8);
  font-size: 12px;
  animation: float 8s linear infinite;
}

@keyframes float {
  from { transform: translateY(120vh) scale(0.5); opacity: 0; }
  to   { transform: translateY(-20vh) scale(1); opacity: 1; }
}

/* 🌸 Card */
.card {
  z-index: 2;
  width: calc(520px * var(--scale));
  padding: calc(36px * var(--scale));
  border-radius: 26px;
  text-align: center;

  background: rgba(255, 220, 230, 0.6);
  backdrop-filter: blur(16px);
  box-shadow: 0 0 35px rgba(255,180,200,0.5);
  animation: glow 4s ease-in-out infinite;
}

/* 💗 Glow pulse */
@keyframes glow {
  0%,100% { box-shadow: 0 0 35px rgba(255,180,200,0.4); }
  50% { box-shadow: 0 0 55px rgba(255,200,220,0.8); }
}

/* 👤 Profile photo */
.profile-pic {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  object-fit: cover;
  margin-bottom: 18px;
  border: 3px solid rgba(255,255,255,0.6);
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  transition: 0.4s ease;
}

.profile-pic:hover {
  transform: scale(1.08) rotate(1deg);
  box-shadow: 0 0 40px rgba(255,200,220,0.9);
}

.name {
  font-size: 34px;
  color: white;
  margin-bottom: 12px;
}

.spark {
  color: white;
  letter-spacing: 8px;
  margin-bottom: 26px;
}

/* 🔗 Icons */
.icons {
  display: flex;
  justify-content: center;
  gap: 30px;
}

.icons a {
  width: 52px;
  height: 52px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.25);
  transition: 0.3s ease;
}

.icons a i {
  color: white;
  font-size: 22px;
}

.icons a:hover {
  transform: scale(1.15);
  background: rgba(255,255,255,0.3);
}

/* 🎧 Visualizer */
.visualizer {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-top: 18px;
}

.bar {
  width: 6px;
  height: 18px;
  background: rgba(255,255,255,0.7);
  border-radius: 6px;
  animation: beat 1s infinite ease-in-out;
}

.bar:nth-child(2) { animation-delay: .2s }
.bar:nth-child(3) { animation-delay: .4s }
.bar:nth-child(4) { animation-delay: .6s }

@keyframes beat {
  0%,100% { height: 10px; }
  50% { height: 26px; }
}
</style>
</head>

<body>

<div class="rain" id="rain"></div>
<div class="sparkles" id="sparkles"></div>

<div class="card">
  <img src="profile.png" class="profile-pic">
  <div class="name">pawslyy</div>
  <div class="spark">✦ ✧ ✦</div>

  <div class="icons">
    <a href="https://www.tiktok.com/@emmaviea" target="_blank"><i class="fa-brands fa-tiktok"></i></a>
    <a href="https://x.com/pawslyy" target="_blank"><i class="fa-brands fa-x-twitter"></i></a>
    <a href="https://t.me/pawslyy" target="_blank"><i class="fa-brands fa-telegram"></i></a>
  </div>

  <div class="visualizer">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
  </div>
</div>

<audio id="music" src="music.mp3" autoplay loop></audio>

<script>
/* Rain */
const rain = document.getElementById("rain");
for (let i = 0; i < 100; i++) {
  const d = document.createElement("div");
  d.className = "drop";
  d.style.left = Math.random() * 100 + "vw";
  d.style.animationDuration = (2 + Math.random() * 3) + "s";
  d.style.opacity = Math.random();
  rain.appendChild(d);
}

/* Sparkles */
const sparkles = document.getElementById("sparkles");
for (let i = 0; i < 40; i++) {
  const s = document.createElement("div");
  s.className = "sparkle";
  s.innerText = "✦";
  s.style.left = Math.random() * 100 + "vw";
  s.style.animationDelay = Math.random() * 8 + "s";
  sparkles.appendChild(s);
}
</script>

</body>
</html>
