<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>pawslyy</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>
:root{
  --pink:#FFD1DC;
  --black:#111;
}

*{ margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background: var(--pink); /* ✅ full pastel pink */
  overflow:hidden;
}

/* no purple underline */
a, a:link, a:visited, a:hover, a:active{
  text-decoration:none !important;
  color: inherit;
}

.wrap{
  text-align:center;
  padding: 28px 22px;
}

.name{
  font-size: 44px;
  font-weight: 600;
  color: var(--black); /* ✅ black text */
  letter-spacing: 0.5px;
}

.sub{
  margin-top: 10px;
  font-size: 14px;
  color: rgba(17,17,17,0.65);
}

/* cute little heart divider */
.hearts{
  margin: 14px 0 18px;
  display:flex;
  justify-content:center;
  gap: 10px;
  color: rgba(17,17,17,0.35);
  font-size: 14px;
}

/* socials */
.icons{
  display:flex;
  justify-content:center;
  gap: 18px;
  margin-top: 6px;
}

.iconBtn{
  width: 46px;
  height: 46px;
  display:grid;
  place-items:center;
  border-radius: 999px;
  background: rgba(255,255,255,0.55);
  border: 1px solid rgba(17,17,17,0.10);
  transition: transform .2s ease, background .2s ease;
}

.iconBtn i{
  color: rgba(17,17,17,0.85);
  font-size: 20px;
}

.iconBtn:hover{
  transform: scale(1.08);
  background: rgba(255,255,255,0.75);
}

/* music player (simple + cute) */
.player{
  margin: 22px auto 0;
  width: min(520px, 90vw);
  background: rgba(255,255,255,0.60);
  border: 1px solid rgba(17,17,17,0.10);
  border-radius: 16px;
  padding: 12px 14px;
}

.playerTop{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap: 12px;
  margin-bottom: 10px;
}

.track{
  text-align:left;
  color: rgba(17,17,17,0.85);
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.time{
  color: rgba(17,17,17,0.55);
  font-size: 12px;
  white-space: nowrap;
}

.playBtn{
  width: 40px;
  height: 40px;
  border-radius: 999px;
  border: 1px solid rgba(17,17,17,0.12);
  background: rgba(255,255,255,0.75);
  cursor:pointer;
  display:grid;
  place-items:center;
  transition: transform .2s ease;
}

.playBtn:hover{ transform: scale(1.06); }

.playBtn i{ color: rgba(17,17,17,0.85); }

.progressWrap{
  width: 100%;
  height: 10px;
  border-radius: 999px;
  background: rgba(17,17,17,0.12);
  overflow:hidden;
  cursor:pointer;
}

.progressFill{
  height:100%;
  width:0%;
  background: rgba(17,17,17,0.55);
}

.hint{
  margin-top: 10px;
  font-size: 12px;
  color: rgba(17,17,17,0.55);
  display:none;
}
.hint.show{ display:block; }
</style>
</head>

<body>

<div class="wrap">
  <div class="name">pawslyy</div>
  <div class="sub">links + music</div>

  <div class="hearts" aria-hidden="true">♡ ♡ ♡</div>

  <div class="icons">
    <a class="iconBtn" href="https://www.tiktok.com/@stupidbunie" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
      <i class="fa-brands fa-tiktok"></i>
    </a>
    <a class="iconBtn" href="https://x.com/pawslyy" target="_blank" rel="noopener noreferrer" aria-label="X">
      <i class="fa-brands fa-x-twitter"></i>
    </a>
    <a class="iconBtn" href="https://t.me/pawslyy" target="_blank" rel="noopener noreferrer" aria-label="Telegram">
      <i class="fa-brands fa-telegram"></i>
    </a>
  </div>

  <div class="player" id="player">
    <div class="playerTop">
      <div>
        <div class="track">u seemed so perfect</div>
        <div class="time"><span id="cur">0:00</span> — <span id="dur">0:00</span></div>
      </div>

      <button class="playBtn" id="playBtn" aria-label="Play/Pause">
        <i class="fa-solid fa-play" id="playIcon"></i>
      </button>
    </div>

    <div class="progressWrap" id="progressWrap" aria-label="Seek">
      <div class="progressFill" id="progressFill"></div>
    </div>

    <div class="hint" id="hint">tap play if sound doesn’t start</div>
  </div>
</div>

<audio id="music" preload="auto" loop playsinline>
  <source src="./music.mp3" type="audio/mpeg">
</audio>

<script>
const music = document.getElementById("music");
const playBtn = document.getElementById("playBtn");
const playIcon = document.getElementById("playIcon");
const cur = document.getElementById("cur");
const dur = document.getElementById("dur");
const progressFill = document.getElementById("progressFill");
const progressWrap = document.getElementById("progressWrap");
const hint = document.getElementById("hint");

function fmt(t){
  if(!isFinite(t)) return "0:00";
  const m = Math.floor(t/60);
  const s = Math.floor(t%60).toString().padStart(2,"0");
  return `${m}:${s}`;
}
function setUI(playing){
  playIcon.className = playing ? "fa-solid fa-pause" : "fa-solid fa-play";
}

async function tryAutoplay(){
  try{
    await music.play();
    setUI(true);
    hint.classList.remove("show");
  }catch(e){
    // browsers may block autoplay — user click will unlock
    hint.classList.add("show");
    setUI(false);
  }
}

playBtn.addEventListener("click", async () => {
  if(music.paused){
    await music.play();
    setUI(true);
    hint.classList.remove("show");
  }else{
    music.pause();
    setUI(false);
  }
});

music.addEventListener("loadedmetadata", () => {
  dur.textContent = fmt(music.duration);
});

music.addEventListener("timeupdate", () => {
  cur.textContent = fmt(music.currentTime);
  const pct = (music.currentTime / (music.duration || 1)) * 100;
  progressFill.style.width = pct + "%";
});

progressWrap.addEventListener("click", (e) => {
  const rect = progressWrap.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const pct = Math.min(Math.max(x / rect.width, 0), 1);
  music.currentTime = pct * (music.duration || 0);
});

// try autoplay on load
tryAutoplay();
</script>

</body>
</html>
