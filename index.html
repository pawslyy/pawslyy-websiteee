<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pawslyy</title>

<style>
body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: #fff6fb;
  color: #d88fb3;
  text-align: center;
  overflow-x: hidden;
  font-size: 140%;
  cursor: url("https://cur.cursors-4u.net/cursors/cur-9/cur817.cur"), auto;
}

/* lace edges */
body::before,
body::after {
  content: "୨୧ ୨୧ ୨୧ ୨୧ ୨୧ ୨୧ ୨୧ ୨୧ ୨୧ ୨୧ ୨୧ ୨୧";
  position: fixed;
  left: 0;
  width: 100%;
  background: #ffeaf5;
  padding: 8px 0;
  font-size: 20px;
  letter-spacing: 6px;
  z-index: 100;
}

body::before { top: 0; }
body::after { bottom: 0; }

header {
  font-size: 34px;
  padding: 30px 14px;
}

.card {
  background: #ffffffcc;
  margin: 30px auto;
  padding: 35px;
  border-radius: 30px;
  width: 92%;
  max-width: 650px;
  box-shadow: 0 8px 20px rgba(255,182,214,0.4);
}

.social-links a {
  display: inline-block;
  background: #ffd6ec;
  margin: 8px;
  padding: 14px 20px;
  border-radius: 18px;
  text-decoration: none;
  color: #c96f9c;
  font-weight: bold;
  font-size: 20px;
}

/* mini game */
#gameArea {
  height: 230px;
  background: #fff7fb;
  border-radius: 20px;
  position: relative;
  overflow: hidden;
  margin-top: 14px;
}

.item {
  position: absolute;
  font-size: 30px;
  cursor: pointer;
}

/* cursor trail */
.symbol {
  position: fixed;
  pointer-events: none;
  font-size: 22px;
  animation: floatUp 1.2s linear forwards;
}

@keyframes floatUp {
  to {
    transform: translateY(-30px);
    opacity: 0;
  }
}

/* falling symbols */
.fall {
  position: fixed;
  top: -20px;
  font-size: 26px;
  animation: fall linear forwards;
}

@keyframes fall {
  to { transform: translateY(100vh); }
}
</style>
</head>

<body>

<header>Pawslyy</header>

<div class="card">
<div class="social-links">
<a href="https://tiktok.com/@stupidbunie" target="_blank">TikTok</a>
<a href="https://twitter.com/pawslyy" target="_blank">Twitter</a>
<a href="https://t.me/pawslyy" target="_blank">Telegram</a>
<a href="https://www.roblox.com/users/profile?username=inwjecting" target="_blank">Roblox</a>
</div>
</div>

<div class="card">
<h3>catch the symbols ✧</h3>
<div id="gameArea"></div>
<p>score: <span id="score">0</span></p>
</div>

<audio id="bgMusic" autoplay loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<script>
window.addEventListener("click", () => {
  document.getElementById("bgMusic").play();
}, { once: true });

const symbols = ["♡","୨୧","✧","꒰","꒱","⋆"];

/* cursor trail */
document.addEventListener("mousemove", function(e) {
  const el = document.createElement("div");
  el.className = "symbol";
  el.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
  el.style.left = e.clientX + "px";
  el.style.top = e.clientY + "px";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1200);
});

/* falling symbols */
setInterval(() => {
  const fall = document.createElement("div");
  fall.className = "fall";
  fall.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];
  fall.style.left = Math.random() * 100 + "vw";
  fall.style.animationDuration = (6 + Math.random() * 4) + "s";
  document.body.appendChild(fall);
  setTimeout(() => fall.remove(), 10000);
}, 700);

/* mini game */
let score = 0;
const gameArea = document.getElementById("gameArea");

function spawnItem() {
  const item = document.createElement("div");
  item.className = "item";
  item.innerHTML = symbols[Math.floor(Math.random() * symbols.length)];

  item.style.left = Math.random() * 90 + "%";
  item.style.top = Math.random() * 70 + "%";

  item.onclick = () => {
    score++;
    document.getElementById("score").innerText = score;
    item.remove();
  };

  gameArea.appendChild(item);
  setTimeout(() => item.remove(), 2400);
}

setInterval(spawnItem, 1100);
</script>

</body>
</html>
