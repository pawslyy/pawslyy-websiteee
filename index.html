<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pawslyy</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      font-size: 16px;
      background: #fff7fb;
      text-align: center;
      overflow-x: hidden;
    }

    header {
      background: #ffb6d9;
      padding: 20px;
      font-size: 24px;
      font-weight: bold;
      position: sticky;
      top: 0;
    }

    section {
      padding: 25px;
    }

    h1 {
      font-size: 28px;
    }

    p {
      font-size: 18px;
    }

    button {
      padding: 12px 18px;
      font-size: 16px;
      background: #ff6fb0;
      border: none;
      border-radius: 10px;
      color: white;
    }

    /* Heart trail */
    .heart {
      position: fixed;
      pointer-events: none;
      font-size: 16px;
      animation: float 1s linear forwards;
    }

    @keyframes float {
      to {
        transform: translateY(-20px);
        opacity: 0;
      }
    }

    /* Desktop scaling */
    @media (min-width: 768px) {
      body {
        font-size: 18px;
      }

      h1 {
        font-size: 36px;
      }

      section {
        max-width: 900px;
        margin: auto;
      }
    }
  </style>
</head>
<body>

<header>Pawslyy</header>

<section>
  <h1>Welcome to Pawslyy</h1>
  <p>Cute pets. Cute vibes. Cute everything.</p>
  <button>Explore</button>
</section>

<!-- Music -->
<audio id="bgMusic" loop>
  <source src="song.mp3" type="audio/mpeg">
</audio>

<script>
  // Autoplay music (mobile needs interaction)
  window.addEventListener("click", () => {
    document.getElementById("bgMusic").play();
  }, { once: true });

  // Heart cursor trail
  document.addEventListener("mousemove", function(e) {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerHTML = "💗";
    heart.style.left = e.clientX + "px";
    heart.style.top = e.clientY + "px";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 1000);
  });
</script>

</body>
</html>
