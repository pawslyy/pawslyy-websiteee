<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pawslyy</title>

<style>
body {
  margin:0;
  background:#000;
  color:white;
  font-family:Arial, sans-serif;
  overflow:hidden;
}

/* center card */
.card {
  position:absolute;
  top:40%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#111;
  padding:40px;
  border-radius:20px;
  text-align:center;
  width:320px;
}

/* spacing */
.card h1 {
  margin-bottom:10px;
}

.links a {
  margin:0 8px;
  color:white;
  text-decoration:none;
}

.musicPlayer {
  position:absolute;
  bottom:40px;
  left:50%;
  transform:translateX(-50%);
  background:#111;
  padding:15px 20px;
  border-radius:14px;
}

#gameCanvas {
  position:absolute;
  bottom:0;
  left:0;
}

/* stars */
.star {
  position:absolute;
  width:2px;
  height:2px;
  background:white;
}

/* falling hearts */
.heart {
  position:fixed;
  color:#ffd1dc;
  animation:fall 6s linear infinite;
}

@keyframes fall {
  from { transform:translateY(-10px); }
  to { transform:translateY(100vh); }
}
</style>
</head>

<body>

<div class="card">
<h1>pawslyy</h1>
<div>hi i love u ♡</div>

<div class="links">
<a href="https://tiktok.com/@stupidbunie" target="_blank">TikTok</a>
<a href="https://x.com/pawslyy" target="_blank">Twitter</a>
<a href="https://t.me/pawslyy" target="_blank">Telegram</a>
<a href="https://www.roblox.com/users/2634203674/profile" target="_blank">Roblox</a>
</div>
</div>

<div class="musicPlayer">
<div>u seemed so perfect</div>
<input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
</div>

<audio id="music" src="music.mp3" loop></audio>

<canvas id="gameCanvas" width="600" height="160"></canvas>

<script>
/* MUSIC AUTOPLAY */
const music = document.getElementById("music");
document.addEventListener("click", () => music.play(), {once:true});
document.getElementById("volume").oninput = e => music.volume = e.target.value;

/* STARS */
for(let i=0;i<120;i++){
  const s=document.createElement("div");
  s.className="star";
  s.style.left=Math.random()*100+"vw";
  s.style.top=Math.random()*100+"vh";
  document.body.appendChild(s);
}

/* FALLING HEARTS */
setInterval(()=>{
  const h=document.createElement("div");
  h.className="heart";
  h.innerText="♡";
  h.style.left=Math.random()*100+"vw";
  document.body.appendChild(h);
  setTimeout(()=>h.remove(),6000);
},800);

/* HEART CURSOR TRAIL */
document.addEventListener("mousemove", e=>{
  const heart=document.createElement("div");
  heart.innerText="♡";
  heart.style.position="fixed";
  heart.style.left=e.clientX+"px";
  heart.style.top=e.clientY+"px";
  heart.style.color="#ffd1dc";
  heart.style.fontSize="10px";
  heart.style.pointerEvents="none";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),500);
});

/* MINI GAME */
const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");

let bunny=new Image();
bunny.src="https://i.imgur.com/6X12F7K.png";

let player={x:50,y:120,vy:0};
let gravity=0.6;
let obstacles=[];
let coins=[];
let score=0;

const jumpSound=new Audio("jump.mp3");
const coinSound=new Audio("coin.mp3");
const hitSound=new Audio("hit.mp3");

function spawn(){
  obstacles.push({x:600,y:130});
}
function spawnCoin(){
  coins.push({x:600,y:90});
}
setInterval(spawn,2000);
setInterval(spawnCoin,1500);

document.addEventListener("keydown", jump);
document.addEventListener("touchstart", jump);

function jump(){
  if(player.y>=120){
    player.vy=-10;
    jumpSound.play();
  }
}

function loop(){
  ctx.clearRect(0,0,600,160);

  player.vy+=gravity;
  player.y+=player.vy;
  if(player.y>120){player.y=120;player.vy=0;}

  ctx.drawImage(bunny,player.x,player.y,30,30);

  obstacles.forEach(o=>{
    o.x-=5;
    ctx.fillRect(o.x,o.y,20,20);
    if(o.x<70&&o.x>40&&player.y>100){
      hitSound.play();
      score=0;
    }
  });

  coins.forEach(c=>{
    c.x-=5;
    ctx.beginPath();
    ctx.arc(c.x,c.y,6,0,Math.PI*2);
    ctx.fill();
    if(Math.abs(c.x-player.x)<10){
      coinSound.play();
      score++;
      c.x=-100;
    }
  });

  ctx.fillText("score "+score,10,20);

  requestAnimationFrame(loop);
}
loop();
</script>

</body>
</html>
