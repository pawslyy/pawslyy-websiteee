<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pawslyy</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: "Segoe UI", sans-serif;
  background: #fff6fb;
  color: #d88fb3;
  text-align: center;
  overflow-x: hidden;
}

/* header decoration */
.lace-header {
  font-size: clamp(22px, 4vw, 36px);
  padding: 16px;
  background: #ffeaf5;
  color: #f4a6c0;
  animation: floatGlow 3s ease-in-out infinite;
}

@keyframes floatGlow {
  0% { transform: translateY(0px); }
  50% { transform: translateY(5px); }
  100% { transform: translateY(0px); }
}

header {
  font-size: clamp(22px, 5vw, 34px);
  margin: 12px 0 20px 0;
}

/* layout container */
.container {
  max-width: 720px;
  margin: auto;
  padding: 20px;
}

/* cards */
.card {
  background: #ffffffcc;
  margin: 20px 0;
  padding: 24px;
  border-radius: 24px;
  box-shadow: 0 6px 18px rgba(255,182,214,0.3);
  animation: fadeIn 0.8s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* social links */
.social-links {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
}

.social-links a {
  background: #ffd6ec;
  padding: 12px 16px;
  border-radius: 14px;
  text-decoration: none;
  color: #c96f9c;
  font-weight: bold;
  transition: transform .15s;
}

.social-links a:hover {
  transform: scale(1.08);
}

/* pixel jump game */
#gameArea {
  height: 200px;
  background: #ffeaf5;
  border-radius: 16px;
  position: relative;
  overflow: hidden;
  border: 3px solid #ffd6ec;
}

.player {
  position: absolute;
  bottom: 0;
  left: 40px;
  font-size: 28px;
}

.obstacle {
  position: absolute;
  bottom: 0;
  right: -40px;
  font-size: 28px;
}

.jump {
  animation: jump 0.45s ease;
}

@keyframes jump {
  0% { bottom: 0; }
  50% { bottom: 70px; }
  100% { bottom: 0; }
}

/* clean cursor sparkle */
.sparkle {
  position: fixed;
  pointer-events: none;
  font-size: 12px;
  opacity: 0.6;
  animation: sparkleFade 0.8s linear forwards;
}

@keyframes sparkleFade {
  to {
    transform: translateY(-10px);
    opacity: 0;
  }
}

.lace-bottom {
  font-size: clamp(18px, 3vw, 26px);
  padding: 14px;
  background: #ffeaf5;
  margin-top: 20px;
  color: #f4a6c0;
}
</style>
</head>

<body>

<div class="lace-header">
⊹₊˚‧︵‿₊୨ᰔ୧₊‿︵‧˚₊⊹
</div>

<div class="container">

<header>Pawslyy</header>

<div class="card">
<div class="social-links">
<a href="https://tiktok.com/@stupidbunie" target="_blank">TikTok</a>
<a href="https://twitter.com/pawslyy" target="_blank">Twitter</a>
<a href="https://t.me/pawslyy" target="_blank">Telegram</a>
<a href="https://www.roblox.com/users/profile?username=inwjecting" target="_blank">Roblox</a>
</div>
</div>

<div class="card">
<h3>pixel jump game</h3>
<div id="gameArea">
<div class="player" id="player">୨୧</div>
</div>
<p>score: <span id="score">0</span></p>
</div>

</div>

<div class="lace-bottom">⊹₊˚‧︵‿₊୨ᰔ୧₊‿︵‧˚₊⊹</div>

<audio id="bgMusic" autoplay loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<audio id="jumpSound">
<source src="https://assets.mixkit.co/sfx/preview/mixkit-quick-jump-arcade-game-239.mp3">
</audio>

<audio id="hitSound">
<source src="https://assets.mixkit.co/sfx/preview/mixkit-retro-arcade-lose-2027.mp3">
</audio>

<script>
window.addEventListener("click", () => {
  document.getElementById("bgMusic").play();
}, { once: true });

/* sparkle cursor */
document.addEventListener("mousemove", e => {
  const s = document.createElement("div");
  s.className = "sparkle";
  s.innerHTML = "✧";
  s.style.left = e.clientX + "px";
  s.style.top = e.clientY + "px";
  document.body.appendChild(s);
  setTimeout(() => s.remove(), 800);
});

/* jump game */
const player = document.getElementById("player");
const gameArea = document.getElementById("gameArea");
const jumpSound = document.getElementById("jumpSound");
const hitSound = document.getElementById("hitSound");

let score = 0;
let jumping = false;

function jump() {
  if (jumping) return;
  jumping = true;
  jumpSound.currentTime = 0;
  jumpSound.play();
  player.classList.add("jump");
  setTimeout(() => {
    player.classList.remove("jump");
    jumping = false;
  }, 450);
}

document.addEventListener("keydown", jump);
document.addEventListener("click", jump);

function spawnObstacle() {
  const obstacle = document.createElement("div");
  obstacle.className = "obstacle";
  obstacle.innerHTML = "✿";
  gameArea.appendChild(obstacle);

  let pos = gameArea.offsetWidth;
  const move = setInterval(() => {
    pos -= 5;
    obstacle.style.right = (gameArea.offsetWidth - pos) + "px";

    const playerBottom = parseInt(window.getComputedStyle(player).bottom);
    if (pos < 80 && pos > 40 && playerBottom < 20) {
      hitSound.play();
      score = 0;
      document.getElementById("score").innerText = score;
      obstacle.remove();
      clearInterval(move);
    }

    if (pos <= 0) {
      score++;
      document.getElementById("score").innerText = score;
      obstacle.remove();
      clearInterval(move);
    }
  }, 20);
}

setInterval(spawnObstacle, 2000);
</script>

</body>
</html>
