<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>pawslyy</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

<style>
:root { --scale: 1.3; }

* { margin:0; padding:0; box-sizing:border-box; font-family: Arial, sans-serif; }

body{
  height:100vh;
  overflow:hidden;
  display:flex;
  justify-content:center;
  align-items:center;

  /* ✅ new background */
  background: url("./R3CF5u0-silent-hill-wallpaper.jpg") no-repeat center/cover;
}

/* ✅ stop purple underline/visited */
a, a:link, a:visited, a:hover, a:active{
  color: inherit;
  text-decoration: none !important;
}

/* layers */
.rain, .mist{
  position:fixed;
  inset:0;
  pointer-events:none;
}

/* 🌧️ rain (soft white) */
.rain{ z-index:1; }

.drop{
  position:absolute;
  top:-12vh;
  width: 6px;
  height: 12px;
  border-radius:999px;
  background: rgba(255,255,255,0.28);
  animation: fall linear infinite;
  filter: blur(0.2px);
}
@keyframes fall{ to{ transform: translateY(130vh); } }

/* 🌫️ mist/fog overlay (cute + pink tint) */
.mist{
  z-index:2;
  /* a soft tinted veil */
  background: radial-gradient(circle at 30% 30%, rgba(255,180,210,0.10), rgba(0,0,0,0.10) 55%),
              radial-gradient(circle at 70% 60%, rgba(255,210,230,0.10), rgba(0,0,0,0.12) 60%);
  backdrop-filter: blur(1.5px);
}

.mist::before,
.mist::after{
  content:"";
  position:absolute;
  inset:-30%;
  background:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,0.10), transparent 55%),
    radial-gradient(circle at 60% 40%, rgba(255,180,210,0.10), transparent 60%),
    radial-gradient(circle at 80% 70%, rgba(255,255,255,0.08), transparent 55%);
  filter: blur(18px);
  opacity: 0.85;
  animation: drift 16s ease-in-out infinite;
}

.mist::after{
  opacity: 0.55;
  filter: blur(26px);
  animation-duration: 22s;
}

@keyframes drift{
  0%   { transform: translate3d(-2%, -1%, 0) scale(1.02); }
  50%  { transform: translate3d(2%, 1%, 0) scale(1.05); }
  100% { transform: translate3d(-2%, -1%, 0) scale(1.02); }
}

/* 🌸 card */
.card{
  z-index:3;
  width: calc(520px * var(--scale));
  padding: calc(36px * var(--scale));
  border-radius: 26px;
  text-align:center;

  /* more moody but still pink */
  background: rgba(255, 200, 220, 0.28);
  backdrop-filter: blur(18px);

  /* pink glow accents */
  box-shadow:
    0 0 0 1px rgba(255,255,255,0.08),
    0 0 50px rgba(255,170,205,0.22),
    0 22px 60px rgba(0,0,0,0.35);

  animation: glow 5s ease-in-out infinite;
}

@keyframes glow{
  0%,100%{ box-shadow:
    0 0 0 1px rgba(255,255,255,0.08),
    0 0 45px rgba(255,170,205,0.18),
    0 22px 60px rgba(0,0,0,0.35); }
  50%{ box-shadow:
    0 0 0 1px rgba(255,255,255,0.10),
    0 0 65px rgba(255,190,220,0.28),
    0 22px 65px rgba(0,0,0,0.38); }
}

/* name */
.name{
  font-size: 34px;
  color:#fff;
  font-weight: 500;
  margin-bottom: 18px; /* ✅ no spark row under it */
  text-shadow: 0 8px 24px rgba(0,0,0,0.25);
}

/* icons */
.icons{
  display:flex;
  justify-content:center;
  gap: 30px;
  margin-bottom: 16px;
}

.icons a{
  width: 52px;
  height: 52px;
  display:grid;
  place-items:center;
  border-radius: 999px;

  background: rgba(255,255,255,0.10);
  border: 1px solid rgba(255,170,205,0.25);
  box-shadow: 0 12px 30px rgba(0,0,0,0.18);
  transition: transform .25s ease, background .25s ease, box-shadow .25s ease;
}

.icons a i{
  color:#fff;
  font-size: 22px;
}

.icons a:hover{
  transform: scale(1.12);
  background: rgba(255,255,255,0.16);
  box-shadow: 0 0 28px rgba(255,170,205,0.22), 0 16px 35px rgba(0,0,0,0.22);
}

/* 🎧 visualizer (tiny cute bars) */
.visualizer{
  display:flex;
  justify-content:center;
  gap: 6px;
  margin-top: 6px;
  margin-bottom: 6px;
  opacity: 0.9;
}

.bar{
  width: 6px;
  height: 18px;
  background: rgba(255,255,255,0.70);
  border-radius: 999px;
  animation: beat 1s infinite ease-in-out;
}
.bar:nth-child(2){ animation-delay: .2s; }
.bar:nth-child(3){ animation-delay: .4s; }
.bar:nth-child(4){ animation-delay: .6s; }

@keyframes beat{
  0%,100%{ height: 10px; opacity:.55; }
  50%{ height: 26px; opacity:1; }
}

/* 🎵 music bar */
.player{
  width: min(860px, 92vw);
  position: fixed;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%);
  z-index: 6;

  padding: 14px 16px;
  border-radius: 18px;
  background: rgba(255, 200, 220, 0.22);
  backdrop-filter: blur(16px);
  box-shadow: 0 18px 45px rgba(0,0,0,0.35);
  border: 1px solid rgba(255,170,205,0.18);
}

.playerTop{
  display:flex;
  justify-content: space-between;
  align-items:center;
  gap: 12px;
  margin-bottom: 10px;
}

.trackTitle{
  color: rgba(255,255,255,0.95);
  font-size: 16px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 45vw;
}

.timeRow{
  display:flex;
  align-items:center;
  gap: 10px;
  color: rgba(255,255,255,0.88);
  font-size: 14px;
  white-space: nowrap;
}

.playBtn{
  width: 40px;
  height: 40px;
  border-radius: 999px;
  border: 1px solid rgba(255,170,205,0.20);
  background: rgba(255,255,255,0.10);
  color: white;
  cursor:pointer;
  display:grid;
  place-items:center;
  transition: transform .2s ease, background .2s ease;
}
.playBtn:hover{
  transform: scale(1.06);
  background: rgba(255,255,255,0.16);
}

.progressWrap{
  width: 100%;
  height: 10px;
  border-radius: 999px;
  background: rgba(255,255,255,0.14);
  overflow: hidden;
  cursor: pointer;
}

.progressFill{
  height: 100%;
  width: 0%;
  background: rgba(255,255,255,0.72);
  border-radius: 999px;
}

.tapHint{
  margin-top: 8px;
  color: rgba(255,200,220,0.70);
  font-size: 12px;
  text-align:center;
  display:none;
}
.tapHint.show{ display:block; }
</style>
</head>

<body>

<div class="rain" id="rain"></div>
<div class="mist"></div>

<div class="card">
  <div class="name">pawslyy</div>

  <!-- ✅ removed the ✦ ✧ ✦ row completely -->

  <div class="icons">
    <a href="https://www.tiktok.com/@emmaviea" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
      <i class="fa-brands fa-tiktok"></i>
    </a>
    <a href="https://x.com/pawslyy" target="_blank" rel="noopener noreferrer" aria-label="X">
      <i class="fa-brands fa-x-twitter"></i>
    </a>
    <a href="https://t.me/pawslyy" target="_blank" rel="noopener noreferrer" aria-label="Telegram">
      <i class="fa-brands fa-telegram"></i>
    </a>
  </div>

  <div class="visualizer" aria-hidden="true">
    <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
  </div>
</div>

<audio id="music" preload="metadata" loop>
  <source src="./music.mp3" type="audio/mpeg">
</audio>

<div class="player" id="player">
  <div class="playerTop">
    <div class="trackTitle" id="trackTitle">u seemed so perfect</div>

    <div class="timeRow">
      <span id="curTime">0:00</span>
      <span style="opacity:.6;">—</span>
      <span id="durTime">0:00</span>
    </div>

    <button class="playBtn" id="playBtn" aria-label="Play/Pause">
      <i class="fa-solid fa-play" id="playIcon"></i>
    </button>
  </div>

  <div class="progressWrap" id="progressWrap" aria-label="Seek">
    <div class="progressFill" id="progressFill"></div>
  </div>

  <div class="tapHint" id="tapHint">tap play to start music</div>
</div>

<script>
/* 🌧️ rain */
const rain = document.getElementById("rain");
for(let i=0;i<110;i++){
  const d=document.createElement("div");
  d.className="drop";
  d.style.left = Math.random()*100 + "vw";
  d.style.animationDuration = (2.1 + Math.random()*3.1) + "s";
  d.style.animationDelay = (-Math.random()*3) + "s";
  d.style.opacity = (0.12 + Math.random()*0.45);
  rain.appendChild(d);
}

/* 🎵 player */
const music = document.getElementById("music");
const playBtn = document.getElementById("playBtn");
const playIcon = document.getElementById("playIcon");
const curTime = document.getElementById("curTime");
const durTime = document.getElementById("durTime");
const progressFill = document.getElementById("progressFill");
const progressWrap = document.getElementById("progressWrap");
const tapHint = document.getElementById("tapHint");

function fmt(t){
  if(!isFinite(t)) return "0:00";
  const m = Math.floor(t/60);
  const s = Math.floor(t%60).toString().padStart(2,"0");
  return `${m}:${s}`;
}
function setPlayUI(isPlaying){
  playIcon.className = isPlaying ? "fa-solid fa-pause" : "fa-solid fa-play";
}
async function tryPlay(){
  try{
    await music.play();
    setPlayUI(true);
    tapHint.classList.remove("show");
  }catch(e){
    tapHint.classList.add("show");
  }
}

playBtn.addEventListener("click", async (e) => {
  e.stopPropagation();
  if(music.paused) await tryPlay();
  else { music.pause(); setPlayUI(false); }
});

music.addEventListener("loadedmetadata", () => {
  durTime.textContent = fmt(music.duration);
});
music.addEventListener("timeupdate", () => {
  curTime.textContent = fmt(music.currentTime);
  const pct = (music.currentTime / (music.duration || 1)) * 100;
  progressFill.style.width = pct + "%";
});

/* seek */
progressWrap.addEventListener("click", (e) => {
  const rect = progressWrap.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const pct = Math.min(Math.max(x / rect.width, 0), 1);
  music.currentTime = pct * (music.duration || 0);
});

/* tap anywhere on the bar to start (mobile friendly) */
document.getElementById("player").addEventListener("click", () => {
  if(music.paused) tryPlay();
}, { passive:true });

setPlayUI(false);
</script>

</body>
</html>
