<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>pawslyy</title>

<style>
body{
margin:0;
background:black;
color:white;
font-family:Arial;
overflow:hidden;
}

/* CARD */
.card{
position:absolute;
top:40%;
left:50%;
transform:translate(-50%,-50%);
background:#111;
padding:50px;
border-radius:20px;
text-align:center;
}

#bio{opacity:.7;margin-top:5px}

/* MINI GAME */
#game{
position:absolute;
bottom:0;
left:0;
width:100%;
height:120px;
border-top:1px solid #333;
overflow:hidden;
}

#runner{
position:absolute;
bottom:10px;
left:40px;
font-size:32px;
}

.obstacle{
position:absolute;
bottom:10px;
right:-20px;
font-size:24px;
}

#score{
position:absolute;
right:20px;
top:10px;
opacity:.6;
}
</style>
</head>
<body>

<audio id="music" src="music.mp3" autoplay loop></audio>

<div class="card">
<h1>pawslyy</h1>
<div id="bio">hi i love u ♡</div>
</div>

<div id="game">
<div id="runner">🐰</div>
<div id="score">0</div>
</div>

<script>

/* MINI PET GAME */
let runner=document.getElementById("runner");
let game=document.getElementById("game");
let scoreEl=document.getElementById("score");

let jumping=false;
let score=0;

/* jump */
document.addEventListener("keydown",e=>{
if(e.code==="Space" && !jumping){
jumping=true;
let pos=10;
let up=setInterval(()=>{
pos+=6;
runner.style.bottom=pos+"px";
if(pos>70) clearInterval(up);
},20);

setTimeout(()=>{
let down=setInterval(()=>{
pos-=6;
runner.style.bottom=pos+"px";
if(pos<=10){
clearInterval(down);
jumping=false;
}
},20);
},300);
}
});

/* obstacles */
function spawn(){
let o=document.createElement("div");
o.className="obstacle";
o.innerHTML="🌵";
game.appendChild(o);

let x=window.innerWidth;

let move=setInterval(()=>{
x-=6;
o.style.right=(window.innerWidth-x)+"px";

let rTop=parseInt(runner.style.bottom||10);
if(x<90 && x>40 && rTop<25){
alert("game over ♡ score: "+score);
location.reload();
}

if(x<0){
clearInterval(move);
o.remove();
score++;
scoreEl.innerHTML=score;
}
},30);

setTimeout(spawn,1500+Math.random()*2000);
}

spawn();

/* autoplay fix */
let audio=document.getElementById("music");
window.addEventListener("click",()=>{
audio.play();
},{once:true});

</script>
</body>
</html>
