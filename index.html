<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>pawslyy</title>

<style>
body{
  margin:0;
  background:#000;
  font-family:Arial, Helvetica, sans-serif;
  color:white;
  overflow:hidden;
}

/* stars */
.star{
  position:absolute;
  width:2px;
  height:2px;
  background:white;
  opacity:.7;
}

/* falling hearts */
.heart{
  position:absolute;
  color:#ffd1dc;
  animation:fall 6s linear infinite;
}
@keyframes fall{
  from{transform:translateY(-10vh)}
  to{transform:translateY(110vh)}
}

/* card */
.card{
  position:absolute;
  top:35%;
  left:50%;
  transform:translate(-50%,-50%);
  background:#111;
  padding:40px;
  border-radius:18px;
  text-align:center;
  animation:breathe 4s ease-in-out infinite;
}
@keyframes breathe{
  0%,100%{transform:translate(-50%,-50%) scale(1)}
  50%{transform:translate(-50%,-50%) scale(1.02)}
}

a{
  color:white;
  margin:10px;
  text-decoration:none;
}

/* bunny pet */
#pet{
  position:absolute;
  bottom:120px;
  left:50%;
  transform:translateX(-50%);
  font-size:40px;
  cursor:pointer;
}

/* speech bubble */
#bubble{
  position:absolute;
  bottom:170px;
  left:50%;
  transform:translateX(-50%);
  background:white;
  color:black;
  padding:6px 10px;
  border-radius:10px;
  font-size:12px;
  display:none;
}

/* music */
#audioBox{
  position:absolute;
  bottom:120px;
  left:50%;
  transform:translateX(-50%);
}

/* game */
#game{
  position:absolute;
  bottom:0;
  width:100%;
  height:150px;
  background:#111;
}
#player{
  position:absolute;
  bottom:0;
  left:50px;
  font-size:30px;
}
.obstacle{
  position:absolute;
  bottom:0;
  right:-20px;
  width:20px;
  height:40px;
  background:white;
}
#score{
  position:absolute;
  left:10px;
  top:5px;
  font-size:12px;
}
</style>
</head>

<body>

<div class="card">
<h1>pawslyy</h1>
<div>hi i love u ♡</div>
<div>
<a href="https://www.tiktok.com">TikTok</a>
<a href="https://x.com/pawslyy">Twitter</a>
<a href="https://t.me/pawslyy">Telegram</a>
<a href="https://www.roblox.com/users/2634203674/profile">Roblox</a>
</div>
</div>

<div id="bubble"></div>
<div id="pet">🐰</div>

<div id="audioBox">
<audio id="music" autoplay loop controls>
<source src="music.mp3">
</audio>
</div>

<div id="game">
<div id="score">score: 0</div>
<div id="player">🐰</div>
</div>

<script>

/* stars */
for(let i=0;i<80;i++){
 let s=document.createElement("div");
 s.className="star";
 s.style.left=Math.random()*100+"vw";
 s.style.top=Math.random()*100+"vh";
 document.body.appendChild(s);
}

/* falling hearts */
setInterval(()=>{
 let h=document.createElement("div");
 h.className="heart";
 h.innerText="♡";
 h.style.left=Math.random()*100+"vw";
 document.body.appendChild(h);
 setTimeout(()=>h.remove(),6000);
},800);

/* bunny mood bubble */
const pet=document.getElementById("pet");
const bubble=document.getElementById("bubble");

const messages=["hi ♡","wiggles ears","feed me star!"];

pet.onclick=()=>{
 bubble.innerText=messages[Math.floor(Math.random()*messages.length)];
 bubble.style.display="block";
 setTimeout(()=>bubble.style.display="none",2000);
};

/* mini game */
let player=document.getElementById("player");
let game=document.getElementById("game");
let scoreEl=document.getElementById("score");

let jumping=false;
let score=0;

function jump(){
 if(jumping)return;
 jumping=true;
 let pos=0;
 let up=setInterval(()=>{
  pos+=4;
  player.style.bottom=pos+"px";
  if(pos>=60) clearInterval(up);
 },10);

 let down=setInterval(()=>{
  pos-=4;
  player.style.bottom=pos+"px";
  if(pos<=0){
   clearInterval(down);
   jumping=false;
  }
 },10);
}

document.addEventListener("keydown",e=>{
 if(e.code==="Space") jump();
});
document.addEventListener("click",jump);

/* obstacles */
function spawnObstacle(){
 let obs=document.createElement("div");
 obs.className="obstacle";
 game.appendChild(obs);

 let x=window.innerWidth;
 obs.style.right="-20px";

 let move=setInterval(()=>{
  x-=5;
  obs.style.right=(window.innerWidth-x)+"px";

  let pRect=player.getBoundingClientRect();
  let oRect=obs.getBoundingClientRect();

  if(
   pRect.left<oRect.right &&
   pRect.right>oRect.left &&
   pRect.bottom>oRect.top
  ){
   alert("pawslyy 1 you 0");
   location.reload();
  }

  if(x<0){
   obs.remove();
   clearInterval(move);
   score++;
   scoreEl.innerText="score: "+score;
  }

 },20);
}

setInterval(spawnObstacle,2000);

</script>
</body>
</html>
