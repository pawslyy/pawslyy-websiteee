<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pawslyy</title>

<style>
body{
margin:0;
background:black;
font-family:Arial;
color:white;
overflow:hidden;
}

/* INTRO GLOW */
.card{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#111;
padding:60px;
border-radius:22px;
text-align:center;
width:420px;
border:1px solid #333;
opacity:0;
animation:intro 2s forwards, breathe 5s infinite;
}
@keyframes intro{to{opacity:1}}
@keyframes breathe{
0%,100%{transform:translate(-50%,-50%) scale(1)}
50%{transform:translate(-50%,-50%) scale(1.02)}
}

/* PARALLAX STARS */
.star{
position:absolute;
width:2px;
height:2px;
background:white;
opacity:.7;
}

/* GLOW FOLLOW */
.glow{
position:absolute;
width:250px;
height:250px;
background:radial-gradient(circle,rgba(255,192,203,.2),transparent);
pointer-events:none;
}

/* LINKS */
.links a{
margin:10px;
color:white;
text-decoration:none;
}
.links a:hover{opacity:.6}

/* STICKER BUTTON */
#stickerBtn{
position:absolute;
top:20px;
left:20px;
cursor:pointer;
opacity:.7;
}

/* STICKER PANEL */
#panel{
position:absolute;
top:60px;
left:20px;
background:#111;
padding:10px;
border-radius:10px;
display:none;
}

/* BUNNY */
#bunny{
position:absolute;
bottom:60px;
right:40px;
font-size:36px;
cursor:pointer;
}

/* HEART */
.heart{
position:absolute;
color:pink;
animation:float 1.2s forwards;
}
@keyframes float{
to{transform:translateY(-60px);opacity:0}
}
</style>
</head>
<body>

<audio id="music" src="music.mp3" autoplay loop></audio>

<div class="glow" id="glow"></div>

<div class="card" id="card">
<h1>pawslyy</h1>
<div id="bio"></div>

<div class="links">
<a href="https://tiktok.com/@stupidbunie">TikTok</a>
<a href="https://x.com/pawslyy">Twitter</a>
<a href="https://t.me/pawslyy">Telegram</a>
<a href="https://www.roblox.com/users/2634203674/profile">Roblox</a>
</div>
</div>

<div id="stickerBtn">stickers ♡</div>
<div id="panel">
<span onclick="stick('⭐')">⭐</span>
<span onclick="stick('💗')">💗</span>
<span onclick="stick('🧸')">🧸</span>
</div>

<div id="bunny">🐰</div>

<script>

/* BIO TYPING LOOP */
let bio="hi i love u ♡";
let i=0;
function loop(){
document.getElementById("bio").innerHTML=bio.substring(0,i);
i++;
if(i>bio.length)i=0;
setTimeout(loop,120);
}
loop();

/* STARS + PARALLAX */
let stars=[];
for(let i=0;i<120;i++){
let s=document.createElement("div");
s.className="star";
s.style.left=Math.random()*100+"vw";
s.style.top=Math.random()*100+"vh";
document.body.appendChild(s);
stars.push(s);
}

document.addEventListener("mousemove",e=>{
stars.forEach(st=>{
st.style.transform=`translate(${e.clientX/100}px,${e.clientY/100}px)`;
});
});

/* GLOW FOLLOW */
let glow=document.getElementById("glow");
document.addEventListener("mousemove",e=>{
glow.style.left=e.clientX-120+"px";
glow.style.top=e.clientY-120+"px";
});

/* HEART CURSOR TRAIL */
document.addEventListener("mousemove",e=>{
let h=document.createElement("div");
h.className="heart";
h.innerHTML="♡";
h.style.left=e.clientX+"px";
h.style.top=e.clientY+"px";
document.body.appendChild(h);
setTimeout(()=>h.remove(),1000);
});

/* MEMORY HEARTS */
document.addEventListener("click",e=>{
for(let i=0;i<6;i++){
let h=document.createElement("div");
h.innerHTML="♡";
h.style.position="absolute";
h.style.left=e.clientX+"px";
h.style.top=e.clientY+"px";
document.body.appendChild(h);
}
});

/* STICKER DRAWER */
let open=false;
document.getElementById("stickerBtn").onclick=()=>{
open=!open;
panel.style.display=open?"block":"none";
};

function stick(x){
document.onclick=e=>{
let s=document.createElement("div");
s.innerHTML=x;
s.style.position="absolute";
s.style.left=e.clientX+"px";
s.style.top=e.clientY+"px";
document.body.appendChild(s);
document.onclick=null;
};
}

/* CARD TILT */
let card=document.getElementById("card");
document.addEventListener("mousemove",e=>{
let x=(window.innerWidth/2-e.clientX)/40;
let y=(window.innerHeight/2-e.clientY)/40;
card.style.transform=`translate(-50%,-50%) rotateY(${x}deg) rotateX(${y}deg)`;
});

/* BUNNY MOOD SYSTEM */
let bunny=document.getElementById("bunny");
let mood=0;
bunny.onclick=()=>{
mood=1;
bunny.innerHTML="🐰✨";
setTimeout(()=>{
mood=2;
bunny.innerHTML="😴";
},5000);
};

/* AUTOPLAY FIX */
window.addEventListener("click",()=>{
document.getElementById("music").play();
},{once:true});

</script>
</body>
</html>
