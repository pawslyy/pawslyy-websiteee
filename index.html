<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pawslyy</title>

<style>
body{
margin:0;
background:black;
font-family:Arial;
color:white;
overflow:hidden;
}

/* CARD */
.card{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
background:#111;
padding:60px;
border-radius:22px;
text-align:center;
width:420px;
border:1px solid #333;
animation:intro 2s forwards, breathe 5s infinite;
opacity:0;
}
@keyframes intro{to{opacity:1}}
@keyframes breathe{
0%,100%{transform:translate(-50%,-50%) scale(1)}
50%{transform:translate(-50%,-50%) scale(1.02)}
}

/* STARS */
.star{
position:absolute;
width:2px;
height:2px;
background:white;
opacity:.7;
}

/* VISUALIZER */
canvas{
position:absolute;
bottom:0;
left:0;
width:100%;
height:120px;
}

/* BUNNY */
#bunny{
position:absolute;
bottom:60px;
left:20px;
font-size:36px;
}

/* HEART TRAIL */
.trail{
position:absolute;
color:pink;
pointer-events:none;
animation:fade 1s forwards;
}
@keyframes fade{
to{opacity:0;transform:translateY(-20px);}
}
</style>
</head>
<body>

<audio id="music" src="music.mp3" autoplay loop></audio>

<div class="card">
<h1>pawslyy</h1>
<div id="bio"></div>

<div class="links">
<a href="https://tiktok.com/@stupidbunie">TikTok</a>
<a href="https://x.com/pawslyy">Twitter</a>
<a href="https://t.me/pawslyy">Telegram</a>
<a href="https://www.roblox.com/users/2634203674/profile">Roblox</a>
</div>
</div>

<canvas id="viz"></canvas>
<div id="bunny">🐰</div>

<script>

/* BIO LOOP */
let bio="hi i love u ♡";
let i=0;
function loop(){
document.getElementById("bio").innerHTML=bio.substring(0,i);
i++; if(i>bio.length)i=0;
setTimeout(loop,120);
}
loop();

/* STARS */
for(let i=0;i<120;i++){
let s=document.createElement("div");
s.className="star";
s.style.left=Math.random()*100+"vw";
s.style.top=Math.random()*100+"vh";
document.body.appendChild(s);
}

/* HEART TRAIL */
document.addEventListener("mousemove",e=>{
let t=document.createElement("div");
t.className="trail";
t.innerHTML="♡";
t.style.left=e.clientX+"px";
t.style.top=e.clientY+"px";
document.body.appendChild(t);
setTimeout(()=>t.remove(),800);
});

/* REAL AUDIO VISUALIZER */
let audio=document.getElementById("music");
let ctx=new AudioContext();
let src=ctx.createMediaElementSource(audio);
let analyser=ctx.createAnalyser();
src.connect(analyser);
analyser.connect(ctx.destination);
analyser.fftSize=64;

let canvas=document.getElementById("viz");
let c=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=120;

let data=new Uint8Array(analyser.frequencyBinCount);

function draw(){
requestAnimationFrame(draw);
analyser.getByteFrequencyData(data);
c.clearRect(0,0,canvas.width,canvas.height);

for(let i=0;i<data.length;i++){
let bar=data[i];
c.fillStyle="white";
c.fillRect(i*10,120-bar/2,6,bar/2);
}
}
draw();

/* AUTOPLAY FIX */
window.addEventListener("click",()=>{
audio.play();
ctx.resume();
},{once:true});

/* WALKING BUNNY */
let bunny=document.getElementById("bunny");
let pos=0;
let dir=1;

setInterval(()=>{
pos+=dir*4;
if(pos>window.innerWidth-40) dir=-1;
if(pos<0) dir=1;
bunny.style.left=pos+"px";
},60);

</script>
</body>
</html>
