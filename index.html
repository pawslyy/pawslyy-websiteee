<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>pawslyy</title>

<style>
body{
margin:0;
background:#000;
font-family:Arial;
color:white;
overflow:hidden;
}

/* INTRO */
.card{
position:absolute;
top:45%;
left:50%;
transform:translate(-50%,-50%);
background:#111;
padding:50px;
border-radius:20px;
text-align:center;
width:420px;
opacity:0;
animation:intro 1.5s forwards, breathe 5s infinite;
border:1px solid #444;
}

@keyframes intro{to{opacity:1}}
@keyframes breathe{
0%,100%{transform:translate(-50%,-50%) scale(1)}
50%{transform:translate(-50%,-50%) scale(1.02)}
}

/* MUSIC PULSE BORDER */
.card.playing{
border-color:pink;
}

/* STARS */
.star{
position:absolute;
width:2px;
height:2px;
background:white;
opacity:.7;
cursor:pointer;
}

/* HEART TRAIL */
.trail{
position:absolute;
color:pink;
pointer-events:none;
animation:fade 1s forwards;
}
@keyframes fade{
to{opacity:0;transform:translateY(-20px);}
}

/* STICKER PANEL */
#panel{
position:absolute;
top:60px;
left:20px;
background:#111;
padding:10px;
border-radius:10px;
display:none;
}

/* GAME */
#game{
position:absolute;
bottom:0;
width:100%;
height:120px;
border-top:1px solid #333;
}

#runner{
position:absolute;
bottom:10px;
left:40px;
font-size:30px;
}

.obstacle{
position:absolute;
bottom:10px;
right:-20px;
}

/* BUNNY */
#bunny{
position:absolute;
bottom:140px;
right:40px;
font-size:34px;
cursor:pointer;
}
</style>
</head>
<body>

<audio id="music" src="music.mp3" autoplay loop></audio>

<div class="card" id="card">
<h1>pawslyy</h1>
<div id="bio"></div>

<div class="links">
<a href="https://tiktok.com/@stupidbunie">TikTok</a>
<a href="https://x.com/pawslyy">Twitter</a>
<a href="https://t.me/pawslyy">Telegram</a>
<a href="https://www.roblox.com/users/2634203674/profile">Roblox</a>
</div>
</div>

<div id="bunny">🐰</div>

<div id="stickerBtn" style="position:absolute;top:20px;left:20px;cursor:pointer;">
stickers ♡
</div>

<div id="panel">
<span onclick="stick('⭐')">⭐</span>
<span onclick="stick('💗')">💗</span>
<span onclick="stick('🧸')">🧸</span>
</div>

<div id="game">
<div id="runner">🐰</div>
</div>

<script>

/* BIO LOOP */
let bio="hi i love u ♡";
let i=0;
function loop(){
bioEl.innerHTML=bio.substring(0,i);
i++; if(i>bio.length)i=0;
setTimeout(loop,120);
}
let bioEl=document.getElementById("bio");
loop();

/* STARS + PARALLAX */
let stars=[];
for(let i=0;i<100;i++){
let s=document.createElement("div");
s.className="star";
s.style.left=Math.random()*100+"vw";
s.style.top=Math.random()*100+"vh";
s.onclick=()=>s.remove();
document.body.appendChild(s);
stars.push(s);
}

document.addEventListener("mousemove",e=>{
stars.forEach(st=>{
st.style.transform=`translate(${e.clientX/120}px,${e.clientY/120}px)`;
});
});

/* HEART TRAIL */
document.addEventListener("mousemove",e=>{
let t=document.createElement("div");
t.className="trail";
t.innerHTML="♡";
t.style.left=e.clientX+"px";
t.style.top=e.clientY+"px";
document.body.appendChild(t);
setTimeout(()=>t.remove(),700);
});

/* MEMORY HEARTS */
document.addEventListener("click",e=>{
let h=document.createElement("div");
h.innerHTML="♡";
h.style.position="absolute";
h.style.left=e.clientX+"px";
h.style.top=e.clientY+"px";
document.body.appendChild(h);
});

/* STICKERS */
let open=false;
stickerBtn.onclick=()=>{
open=!open;
panel.style.display=open?"block":"none";
};

function stick(x){
document.onclick=e=>{
let s=document.createElement("div");
s.innerHTML=x;
s.style.position="absolute";
s.style.left=e.clientX+"px";
s.style.top=e.clientY+"px";
document.body.appendChild(s);
document.onclick=null;
};
}

/* CARD TILT */
let card=document.getElementById("card");
document.addEventListener("mousemove",e=>{
let x=(window.innerWidth/2-e.clientX)/40;
let y=(window.innerHeight/2-e.clientY)/40;
card.style.transform=`translate(-50%,-50%) rotateY(${x}deg) rotateX(${y}deg)`;
});

/* BUNNY MOOD SYSTEM */
let bunny=document.getElementById("bunny");
bunny.onclick=()=>{
bunny.innerHTML="🐰✨";
setTimeout(()=>bunny.innerHTML="😴",4000);
};

/* MUSIC BORDER */
let audio=document.getElementById("music");
setInterval(()=>{
if(!audio.paused){
card.classList.add("playing");
setTimeout(()=>card.classList.remove("playing"),200);
}
},800);

/* AUTOPLAY FIX */
window.addEventListener("click",()=>audio.play(),{once:true});

/* MINI GAME */
let runner=document.getElementById("runner");
let jumping=false;

document.addEventListener("keydown",e=>{
if(e.code==="Space"&&!jumping){
jumping=true;
let pos=10;
let up=setInterval(()=>{
pos+=6;
runner.style.bottom=pos+"px";
if(pos>70)clearInterval(up);
},20);

setTimeout(()=>{
let down=setInterval(()=>{
pos-=6;
runner.style.bottom=pos+"px";
if(pos<=10){
clearInterval(down);
jumping=false;
}
},20);
},300);
}
});

/* obstacles */
function spawn(){
let o=document.createElement("div");
o.className="obstacle";
o.innerHTML="🌵";
game.appendChild(o);

let x=window.innerWidth;

let move=setInterval(()=>{
x-=6;
o.style.right=(window.innerWidth-x)+"px";

let r=parseInt(runner.style.bottom||10);
if(x<90 && x>40 && r<25){
alert("pawslyy wins ♡");
location.reload();
}

if(x<0){
clearInterval(move);
o.remove();
}
},30);

setTimeout(spawn,1800);
}
spawn();

</script>
</body>
</html>
