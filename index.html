<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pawslyy</title>

<style>
:root{
--ink:#b98f86;
--ink2:#caa29a;
--pink1:#eec7cf;
--pink2:#f3d5da;
--pink3:#f7e5e9;
--glass:rgba(255,255,255,.55);
--shadow:0 14px 40px rgba(160,120,110,.20);
--r:22px;
--r2:16px;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:'Segoe UI',sans-serif;
background:url("bg.jpg") center/cover fixed;
overflow-x:hidden;
}

body::before{
content:"";
position:fixed;
inset:0;
background:rgba(255,255,255,0.35);
backdrop-filter:blur(2px);
z-index:-1;
}

.lace{
text-align:center;
padding:14px;
background:var(--glass);
color:var(--ink2);
font-size:28px;
animation:float 4s ease-in-out infinite;
}

@keyframes float{
0%,100%{transform:translateY(0)}
50%{transform:translateY(6px)}
}

.container{
width:min(720px,92vw);
margin:auto;
padding:20px;
display:flex;
flex-direction:column;
gap:16px;
}

.card{
background:var(--glass);
backdrop-filter:blur(12px);
padding:20px;
border-radius:var(--r);
box-shadow:var(--shadow);
transition:.2s;
}

.card:hover{
transform:translateY(-4px);
}

.socials{
display:flex;
flex-wrap:wrap;
gap:10px;
justify-content:center;
}

.socials a{
background:var(--pink2);
padding:10px 16px;
border-radius:12px;
text-decoration:none;
color:var(--ink);
font-weight:bold;
}

/* GAME */
.gameWrap{
height:200px;
background:var(--pink3);
border-radius:var(--r2);
position:relative;
overflow:hidden;
border:2px solid var(--pink2);
}

#player{
position:absolute;
left:56px;
bottom:26px;
font-size:28px;
}

.ground{
position:absolute;
bottom:0;
height:22px;
width:200%;
background:var(--pink1);
animation:move 1s linear infinite;
}

@keyframes move{
from{transform:translateX(0)}
to{transform:translateX(-50%)}
}

.obstacle{
position:absolute;
bottom:26px;
font-size:28px;
}

.overlay{
position:absolute;
inset:0;
background:rgba(255,255,255,.6);
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
}

.hud{
display:flex;
justify-content:space-between;
margin-top:8px;
color:var(--ink);
font-weight:bold;
}

.pop{
animation:pop .2s;
}

@keyframes pop{
50%{transform:scale(1.2)}
}

.music{
position:fixed;
bottom:15px;
right:15px;
background:var(--glass);
padding:10px;
border-radius:14px;
box-shadow:var(--shadow);
cursor:pointer;
}
</style>
</head>

<body>

<div class="lace">⊹₊˚‧︵‿₊୨ᰔ୧₊‿︵‧˚₊⊹</div>

<div class="container">

<div class="card">
<div class="socials">
<a href="https://tiktok.com/@stupidbunie" target="_blank">TikTok</a>
<a href="https://twitter.com/pawslyy" target="_blank">Twitter</a>
<a href="https://t.me/pawslyy" target="_blank">Telegram</a>
<a href="https://roblox.com/users/profile?username=inwjecting" target="_blank">Roblox</a>
</div>
</div>

<div class="card">
<div class="gameWrap" id="game">
<div id="player">୨୧</div>
<div class="overlay" id="overlay">
<button onclick="start()">start</button>
</div>
<div class="ground"></div>
</div>
<div class="hud">
score:<span id="score">0</span>
best:<span id="best">0</span>
</div>
</div>

</div>

<div class="music" onclick="toggle()">♫</div>

<audio id="music" autoplay loop>
<source src="music.mp3">
</audio>

<script>
music.play().catch(()=>{});
document.addEventListener("click",()=>music.play(),{once:true});

function toggle(){
music.paused?music.play():music.pause();
}

/* ===== FIXED RUNNER GAME ===== */

let score=0;
let best=localStorage.getItem("best")||0;
document.getElementById("best").textContent=best;

const player=document.getElementById("player");
const game=document.getElementById("game");
let running=false;
let speed=320;
let obstacles=[];
let spawnTimer=0;

let playerY=0;
let playerVY=0;
const gravity=2000;
const jumpForce=750;

function start(){
overlay.style.display="none";
score=0;
playerY=0;
playerVY=0;
speed=320;
scoreEl.textContent=score;
obstacles.forEach(o=>o.el.remove());
obstacles=[];
running=true;
lastTime=performance.now();
requestAnimationFrame(loop);
}

function jump(){
if(!running)return;
if(playerY>1)return;
playerVY=jumpForce;
}

document.addEventListener("keydown",e=>{
if(e.code==="Space")jump();
});
document.addEventListener("click",jump);

function spawnObstacle(){
const el=document.createElement("div");
el.className="obstacle";
el.innerHTML="✿";
game.appendChild(el);

obstacles.push({
el,
x:game.clientWidth+40,
passed:false
});
}

let lastTime=performance.now();

function loop(t){

if(!running)return;

const dt=(t-lastTime)/1000;
lastTime=t;

playerVY-=gravity*dt;
playerY+=playerVY*dt;
if(playerY<0){playerY=0;playerVY=0;}
player.style.transform=`translateY(${-playerY}px)`;

speed+=dt*5;

spawnTimer-=dt;
if(spawnTimer<=0){
spawnObstacle();
spawnTimer=0.8+Math.random()*0.8;
}

for(let i=obstacles.length-1;i>=0;i--){
let o=obstacles[i];
o.x-=speed*dt;
o.el.style.left=o.x+"px";

if(o.x<56+28 && o.x+28>56 && playerY<28){
running=false;
overlay.style.display="flex";
score=0;
scoreEl.textContent=score;
return;
}

if(!o.passed && o.x+28<56){
o.passed=true;
score++;
scoreEl.textContent=score;
scoreEl.classList.add("pop");
setTimeout(()=>scoreEl.classList.remove("pop"),200);
if(score>best){
best=score;
localStorage.setItem("best",best);
bestEl.textContent=best;
}
}

if(o.x<-50){
o.el.remove();
obstacles.splice(i,1);
}
}

requestAnimationFrame(loop);
}
</script>

</body>
</html>
